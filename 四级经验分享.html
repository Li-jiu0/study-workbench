// 渲染文章列表
function renderArticles() {
  var list = document.getElementById('articleList');
  list.innerHTML = articles.map(function(a) {
    var source = sourceStyles[a.sourceType] || sourceStyles.blog;
    return '<div class="article-item" id="article-' + a.id + '">' +
      '<div class="article-header" onclick="toggleArticle(' + a.id + ')">' +
        '<div class="article-icon" style="background:' + a.iconBg + '">' + a.icon + '</div>' +
        '<div class="article-info">' +
          '<div class="article-title">' + a.title + '</div>' +
          '<div class="article-meta">' +
            '<span class="source-tag ' + source.class + '">' + source.name + '</span>' +
            '<span>' + a.source + '</span>' +
            '<span class="article-date">📅 ' + a.date + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="article-arrow">▼</div>' +
      '</div>' +
      '<div class="article-content">' +
        '<div class="article-body">' + a.content + '</div>' +
        '<div class="article-footer">' +
          '<div class="article-tags">' +
            a.tags.map(function(t) { return '<span class="article-tag">' + t + '</span>'; }).join('') +
          '</div>' +
          '<a class="view-original" onclick="event.stopPropagation();window.open(\'' + a.url + '\',\'_blank\')">查看原文 →</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// 展开/收起文章
function toggleArticle(id) {
  var item = document.getElementById('article-' + id);
  item.classList.toggle('open');
}

// （从个人中心进来就回个人中心），无历史时兜底回首页。原实现硬跳首页，会丢失来处。
function goBack() {
  if (history.length > 1) { history.back(); return; }
  var ref = document.referrer || '';
  if (ref.indexOf('个人中心.html') >= 0) { location.href = '个人中心.html'; return; }
  location.href = '学习工作台.html';
}
