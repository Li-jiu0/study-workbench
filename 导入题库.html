/* ==================== R72-8（20260917）：导入题库 · 独立整页 ====================

   向导逻辑仍全部复用 assets/importer.js（openImporter / __impDo 等），本页只提供承载容器与返回。 */
.importer-page-body{background:var(--card);color:var(--text);border-radius:18px;padding:16px;box-shadow:0 10px 30px -18px rgba(0,0,0,.25)}
/* importer.js 的 ensureCss() 给 .imp-body 设了 overflow-y:auto;flex:1（弹层内用），整页里要放开 */
.importer-page-body .imp-body{overflow:visible;padding:0;flex:none}
/* 我的导入题库（按文件名自动生成的自定义题库，数据来自 localStorage 的 study_workbench_imports） */

.imp-libs-t{font-size:13px;font-weight:700;color:var(--text-secondary);margin:0 0 8px}
.imp-lib{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.imp-lib-h{display:flex;align-items:center;gap:8px;cursor:pointer}
.imp-lib-n{flex:1;font-weight:700;font-size:14px;color:var(--text)}
.imp-lib-c{font-size:12px;color:var(--text-secondary)}
.imp-lib-b{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:12px;padding:2px 6px}
.imp-lib-items{display:none;margin-top:8px;max-height:240px;overflow:auto;font-size:12px;line-height:1.8;color:var(--text-secondary);white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px}
.imp-lib.open .imp-lib-items{display:block}
.imp-empty{font-size:12px;color:var(--text-muted);padding:8px 2px;line-height:1.7}
/* 需求20-B（2026-09-17）：窄屏加固 —— 长文本/表格内容可断行，页面不横向滚动，卡片与列表项不挤压。 */
.imp-lib-items{overflow-wrap:anywhere;word-break:break-word}
.imp-lib-n{word-break:break-word}
@media (max-width:560px){
  .importer-page-body{padding:12px}
  .importer-page-body .imp-body{padding:0}
  .imp-lib-h{flex-wrap:wrap;gap:4px}
  .imp-lib-c{flex:1 1 100%}
}
</style>

<script>
/* ==================== R72-8（20260917）：导入题库 · 独立页接线 ====================
   向导主体全部复用 assets/importer.js（openImporter / __impDo / __impBanks / __impDelBank）。
   本页只做三件事：① 初始化向导并把 #impBody 迁入页面容器；② 导入完成后重载向导（供再导入）；
   ③ 渲染「我的导入题库」列表。整页布局，无弹层遮罩。 */
(function () {
  'use strict';

  function $id(x) { return document.getElementById(x); }

  function escImp(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function impItemText(it) {
    if (!it) return '(空)';
    if (it.q) return it.q + (it.options && it.options.length ? '（' + it.options.join(' / ').slice(0, 80) + '）' : '');
    if (it.text) return it.text;
    if (it.question) return it.question;
    if (it.word) return it.word + (it.meaning ? '  ' + it.meaning : '');
    return JSON.stringify(it).slice(0, 80);
  }

  /* 打开/重载向导：由 importer.js 的 openImporter() 初始化状态与步骤 DOM，
     再把向导主体 #impBody 从弹层外壳搬进本页容器并移除弹层外壳（不改动 importer.js 任何函数）。 */
  function openImporterView() {
    if (!window.openImporter) { location.href = '设置.html'; return; }
    window.openImporter();
    var mask = $id('impMask');
    var body = $id('impBody');
    var host = $id('importerView');
    if (mask && body && host) {
      var wrap = host.querySelector('.importer-page-body') || host;
      // 清掉上一次遗留的 #impBody，避免重复 id 让向导渲染进已被替换的旧节点（表现为点了没反应）
      var olds = wrap.querySelectorAll('#impBody');
      for (var oi = 0; oi < olds.length; oi++) {
        if (olds[oi] !== body && olds[oi].parentNode) olds[oi].parentNode.removeChild(olds[oi]);
      }
      wrap.appendChild(body);
      if (mask.parentNode) mask.parentNode.removeChild(mask);
    }
  }
  /* importer.js 导入成功后回调：本页重载向导（准备再导入一份），而非弹层 closeI（那会清空 S 让向导失效） */
  function closeImporterView() { openImporterView(); }

  window.openImporterView = openImporterView;
  window.closeImporterView = closeImporterView;

  /* ---------- 我的导入题库（自定义题库列表，来源 assets/importer.js 写入的 localStorage） ---------- */
  function renderImportLibs() {
    var host = $id('impLibs');
    if (!host) return;
    if (typeof window.__impBanks !== 'function') {
      host.innerHTML = '<div class="imp-libs-t">我的导入题库</div><div class="imp-empty">导入向导尚未就绪（assets/importer.js 未加载），请刷新页面重试。</div>';
      return;
    }
    var banks = window.__impBanks() || {};
    var names = Object.keys(banks);
    if (!names.length) {
      host.innerHTML = '<div class="imp-libs-t">我的导入题库</div><div class="imp-empty">还没有导入记录。导入后会自动按文件名生成自定义题库（例如「自定义·四级词汇表」），出现在这里，可展开查看、也可在导入时选它继续追加。</div>';
      return;
    }
    host.innerHTML = '<div class="imp-libs-t">我的导入题库（' + names.length + '）</div>' + names.map(function (n) {
      var b = banks[n] || {}, items = b.items || [];
      var prev = items.slice(0, 30).map(function (it, i) { return (i + 1) + '. ' + impItemText(it); }).join('\n');
      return '<div class="imp-lib" data-n="' + escImp(n) + '">' +
        '<div class="imp-lib-h" onclick="this.parentNode.classList.toggle(\'open\')">' +
        '<span class="imp-lib-n">📦 ' + escImp(n) + '</span>' +
        '<span class="imp-lib-c">' + items.length + ' 条 · ' + escImp(b.updatedAt || '') + ' ›</span>' +
        '</div>' +
        '<div class="imp-lib-items">' + escImp(prev || '（该题库暂无内容）') + (items.length > 30 ? '\n… 仅显示前 30 条' : '') + '</div>' +
        '<div style="margin-top:6px;text-align:right"><button class="imp-lib-b" onclick="removeImportLib(this)">删除该题库</button></div>' +
        '</div>';
    }).join('');
  }

  function removeImportLib(btn) {
    var box = btn && btn.parentNode ? btn.parentNode : null;
    while (box && box.className && String(box.className).indexOf('imp-lib') < 0) box = box.parentNode;
    var n = box ? box.getAttribute('data-n') : '';
    if (!n) return;
    if (typeof window.__impDelBank === 'function') window.__impDelBank(n);
    renderImportLibs();
    if (typeof window.xtToast === 'function') window.xtToast('info', '已删除自定义题库「' + n + '」');
  }
  window.removeImportLib = removeImportLib;
  window.renderImportLibs = renderImportLibs;
  /* importer.js 导入成功后回调，用于刷新本列表 */
  window.__impAfterImport = renderImportLibs;

  function boot() {
    openImporterView();
    renderImportLibs();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  /* importer.js 带 defer，晚于本内联脚本执行：DOMContentLoaded 时再渲染一次，避免首屏显示“未就绪” */
  window.addEventListener('DOMContentLoaded', renderImportLibs);
})();
</script>
</body>
</html>
