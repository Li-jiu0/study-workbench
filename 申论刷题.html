<style>
/* ===== 申论刷题页专用样式（复用 common.css 变量，不新增色板） ===== */
.sl-tabs { display: flex; gap: 8px; padding: 14px 24px 0; }
.sl-tab { display: flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--text-secondary); background: var(--card); border: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
.sl-tab:hover { color: var(--primary); border-color: var(--primary); }
.sl-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.sl-body { padding: 14px 24px 32px; }
.sl-filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.sl-lab { font-size: 13px; color: var(--text-secondary); }
.sl-select { width: auto; min-width: 132px; padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.sl-meta { font-size: 13px; color: var(--text-secondary); margin: 2px 0 12px; }
.sl-qcard { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 12px; background: var(--card); transition: var(--transition); }
.sl-qcard:hover { box-shadow: var(--shadow-hover); }
.sl-qtitle { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.sl-qreq { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin: 8px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sl-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.sl-status { font-size: 13px; margin: 8px 0 0; }
.sl-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 10px; }
.sl-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.sl-htitle { font-size: 16px; font-weight: 700; color: var(--text); flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.sl-back { display: inline-flex; align-items: center; cursor: pointer; color: var(--text-secondary); }
.sl-back:hover { color: var(--primary); }
.sl-split { display: flex; gap: 16px; padding: 16px; min-height: 520px; }
.sl-col { display: flex; flex-direction: column; min-width: 0; }
.sl-mat { flex: 1 1 50%; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; transition: var(--transition); }
.sl-mat.collapsed { flex: 0 0 60px; }
.sl-mat.collapsed .sl-mat-body { display: none; }
.sl-mat.collapsed .sl-mat-head { writing-mode: vertical-rl; height: 100%; justify-content: flex-start; padding: 14px 8px; }
.sl-mat-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--primary-light); font-size: 14px; font-weight: 600; color: var(--primary); }
.sl-mat-head .sl-sp { flex: 1; }
.sl-mini-btn { font-size: 12px; font-weight: 600; color: var(--primary); cursor: pointer; padding: 2px 8px; border: 1px solid var(--primary); border-radius: 8px; white-space: nowrap; }
.sl-mat-body { padding: 14px 16px; font-size: 16px; line-height: 1.8; color: var(--text); overflow-y: auto; flex: 1; max-height: calc(100vh - 270px); }
.sl-mat-body p { margin-bottom: 12px; }
.sl-ans { flex: 1 1 50%; display: flex; flex-direction: column; gap: 10px; }
.sl-box { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; line-height: 1.7; color: var(--text-secondary); background: var(--bg); }
.sl-box b { color: var(--text); }
.sl-ta, .sl-note { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 15px; line-height: 1.8; color: var(--text); background: var(--card); resize: vertical; }
.sl-ta { min-height: 240px; flex: 1; }
.sl-note { min-height: 90px; font-size: 14px; }
.sl-count { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 10px; }
.sl-saved { font-size: 12px; color: var(--success); opacity: 0; transition: opacity .3s; }
.sl-saved.on { opacity: 1; }
mark.sl-hl { background: #FFE9A8; color: inherit; }
.sl-ke { background: linear-gradient(transparent 58%, #FFE08A 58%); cursor: pointer; font-weight: 600; }
.sl-ke:hover { background: #FFD24D; }
.sl-ansview { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 15px; line-height: 1.8; color: var(--text); background: var(--card); white-space: pre-wrap; overflow-y: auto; min-height: 200px; max-height: calc(100vh - 300px); }
.sl-foot { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-top: 1px solid var(--border); }
.sl-block { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 18px; margin-bottom: 14px; background: var(--card); cursor: pointer; transition: var(--transition); }
.sl-block:hover { box-shadow: var(--shadow-hover); }
.sl-block h4 { font-size: 15px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.sl-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
.sl-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sl-expr { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; background: var(--card); display: flex; flex-direction: column; gap: 8px; }
.sl-econtent { font-size: 14px; line-height: 1.7; color: var(--text); flex: 1; word-break: break-word; }
.sl-esrc { font-size: 12px; color: var(--text-muted); }
.sl-expr-acts { display: flex; gap: 8px; justify-content: flex-end; }
.sl-mini { font-size: 12px; padding: 3px 10px; border-radius: 8px; border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; background: transparent; }
.sl-mini:hover { border-color: var(--primary); color: var(--primary); }
.sl-chip { padding: 5px 12px; border-radius: 20px; font-size: 13px; border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.sl-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.sl-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
.sl-article { max-width: 700px; margin: 0 auto; padding: 8px 4px; font-size: 16px; line-height: 1.8; color: var(--text); }
.sl-article p { margin-bottom: 14px; }
.sl-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.45); z-index: 1500; align-items: center; justify-content: center; }
.sl-overlay.on { display: flex; }
.sl-confirm { background: var(--card); border-radius: var(--radius); padding: 22px; width: 90%; max-width: 380px; box-shadow: var(--shadow-hover); }
.sl-confirm-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
.sl-confirm-msg { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 18px; }
.sl-confirm-actions { display: flex; gap: 10px; }
.sl-confirm-actions .btn { flex: 1; }
.sl-sheet { background: var(--card); border-radius: var(--radius); padding: 22px; width: 92%; max-width: 480px; max-height: 78vh; display: flex; flex-direction: column; }
.sl-sheet-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
.sl-sheet-list { overflow-y: auto; flex: 1; margin-bottom: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
.sl-ck { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; font-size: 14px; line-height: 1.6; border-bottom: 1px solid var(--border); }
.sl-ck:last-child { border-bottom: none; }
.sl-sheet-actions { display: flex; gap: 10px; }
.sl-sheet-actions .btn { flex: 1; }
.sl-selbar { display: none; position: fixed; z-index: 1600; gap: 6px; background: var(--text); padding: 6px; border-radius: 10px; box-shadow: var(--shadow-hover); }
.sl-selbar.on { display: flex; }
.sl-selbar button { background: transparent; color: #fff; font-size: 13px; padding: 5px 10px; border-radius: 8px; }
.sl-selbar button:hover { background: rgba(255,255,255,.18); }
.sl-empty { text-align: center; padding: 46px 16px; color: var(--text-muted); }
.sl-ei { margin-bottom: 12px; opacity: .45; }
.sl-et { font-size: 15px; color: var(--text); font-weight: 600; margin-bottom: 6px; }
.sl-res { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; font-size: 14px; cursor: pointer; background: var(--card); }
.sl-res:hover { background: var(--primary-light); }
.sl-res .sl-rk { font-size: 12px; color: var(--text-muted); }
.sl-fav { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; background: var(--card); }
.sl-ft { flex: 1; font-size: 14px; color: var(--text); }
.sl-sub { font-size: 13px; font-weight: 700; color: var(--text); margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
.sl-divider { height: 1px; background: var(--border); margin: 16px 0; }
.sl-addform { border: 1px dashed var(--primary); border-radius: var(--radius-sm); padding: 14px 16px; margin-top: 12px; background: var(--primary-light); }
.sl-inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
@media (max-width: 900px) {
  .sl-split { flex-direction: column; }
  .sl-grid2 { grid-template-columns: 1fr; }
  .sl-body, .sl-tabs { padding-left: 12px; padding-right: 12px; }
}
</style>
</head>

<script>
/* =====================================================================
   申论刷题.html · 页面内逻辑（全部内联，不新增任何库）
   存储键：shenlun_answers / shenlun_read_progress / shenlun_expressions / shenlun_favorites
   数据源：全局题库中 type==='申论' 的题（兼容 INLINE_SHENLUN_BANK / JSON 文件 / localStorage）
   ===================================================================== */
var SL = {
  data: [], tab: 1, v1: 'list', v2: 'home',
  qid: null, mid: null, list: [],
  fType: '全部', fSub: '全部', fTopic: '全部',
  matMode: 'topic', matTopic: '全部', matType: '全部',
  exprTopic: '全部', exprCat: '全部', exprKw: '', homeKw: '',
  addForm: false, showFav: false,
  saveTimer: null, savedTimer: null, confirmCb: null
};

var K_ANS = 'shenlun_answers', K_READ = 'shenlun_read_progress',
    K_EXPR = 'shenlun_expressions', K_FAV = 'shenlun_favorites';

var MAIN_TYPES = ['单一题', '综合题', '公文题'];
var TOPICS = ['乡村振兴', '社会治理', '政府职能', '民生保障', '城市建设', '人才建设', '文化建设', '创新创业', '时代精神', '互联网', '生态建设', '其他'];
var SUB_MAP = {
  '单一题': ['问题类', '影响类', '对策类', '原因类', '特殊要素'],
  '综合题': ['概括主要内容', '词句解释', '观点现象分析', '其他题型'],
  '公文题': ['方案类', '宣传类', '总结类', '评论类']
};

/* ---------------- 工具 ---------------- */
function slEsc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function slCount(t) { return String(t || '').replace(/\s/g, '').length; }
function slIcons() {
  try { if (typeof window.lucideAutoRender === 'function') window.lucideAutoRender(); } catch (e) { /* 忽略 */ }
}
function slToast(msg) {
  try { if (typeof window.xtToast === 'function') { window.xtToast('info', msg); return; } } catch (e) { /* 继续兜底 */ }
  try { if (typeof window.showToast === 'function') { window.showToast(msg); return; } } catch (e) { /* 继续兜底 */ }
  try { if (typeof window.toast === 'function') { window.toast(msg); return; } } catch (e) { /* 继续兜底 */ }
  var t = document.getElementById('toast');
  if (t) {
    t.textContent = msg;
    t.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(function () { t.style.transform = 'translateX(-50%) translateY(-100px)'; }, 2000);
  }
}
function slUid(p) { return (p || 'e') + '_' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }

/* ---------------- localStorage ---------------- */
function slGet(key, def) {
  try { var v = localStorage.getItem(key); return v === null || v === undefined ? def : JSON.parse(v); } catch (e) { return def; }
}
function slSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; }
}
function slAns(id) { var m = slGet(K_ANS, {}); return (m && m[id]) || null; }
function slSetAns(id, obj) {
  var m = slGet(K_ANS, {}) || {};
  var old = m[id] || {};
  for (var k in obj) { if (Object.prototype.hasOwnProperty.call(obj, k)) old[k] = obj[k]; }
  m[id] = old; slSet(K_ANS, m);
}
function slDelAns(id) { var m = slGet(K_ANS, {}) || {}; delete m[id]; slSet(K_ANS, m); }
function slReadRec(id) {
  var m = slGet(K_READ, {}) || {};
  var r = m[id];
  if (!r) return { highlights: [], note: '', read: false };
  return { highlights: r.highlights || [], note: r.note || '', read: !!r.read };
}
function slSetRead(id, obj) {
  var m = slGet(K_READ, {}) || {};
  var old = slReadRec(id);
  for (var k in obj) { if (Object.prototype.hasOwnProperty.call(obj, k)) old[k] = obj[k]; }
  m[id] = old; slSet(K_READ, m);
}
function slExprs() { var a = slGet(K_EXPR, []); return Object.prototype.toString.call(a) === '[object Array]' ? a : []; }
function slSaveExprs(a) { slSet(K_EXPR, a); }
function slFavs() { var a = slGet(K_FAV, []); return Object.prototype.toString.call(a) === '[object Array]' ? a : []; }
function slSaveFavs(a) { slSet(K_FAV, a); }
function slIsFav(id) { return slFavs().indexOf(id) >= 0; }
function slToggleFav(id) {
  var a = slFavs(), i = a.indexOf(id);
  if (i >= 0) { a.splice(i, 1); } else { a.unshift(id); }
  slSaveFavs(a);
  return i < 0;
}

/* ---------------- 题库读取与容错 ---------------- */
function slIsShenlun(q) {
  if (!q || typeof q !== 'object') return false;
  if (q.type === '申论') return true;
  var cands = [q.type, q.subType, q.qType, q.category];
  for (var i = 0; i < cands.length; i++) {
    if (cands[i] && MAIN_TYPES.indexOf(cands[i]) >= 0) return true;
  }
  return !!(q.material || q.referenceAnswer) && !!(q.subType || q.questionNo || q.requirement);
}
function slTypeOf(q) {
  var cands = [q.type, q.subType, q.qType, q.category];
  for (var i = 0; i < cands.length; i++) {
    if (cands[i] && MAIN_TYPES.indexOf(cands[i]) >= 0) return cands[i];
  }
  return '单一题';
}
function slSubOf(q) {
  var t = slTypeOf(q);
  var cands = [q.subType, q.qType, q.type];
  for (var i = 0; i < cands.length; i++) {
    var v = cands[i];
    if (v && v !== t && MAIN_TYPES.indexOf(v) < 0 && v !== '申论') return v;
  }
  return '';
}
function slNorm(q, idx) {
  var kes = q.keyExpressions || q.key_expressions;
  return {
    id: String(q.id || q.qid || ('sl_auto_' + idx)),
    source: q.source || q.from || '',
    questionNo: q.questionNo || q.no || '',
    type: slTypeOf(q),
    subType: slSubOf(q),
    topic: q.topic || '其他',
    score: Number(q.score) || 0,
    wordLimit: Number(q.wordLimit || q.word_limit) || 0,
    requirement: q.requirement || q.q || '',
    materialTitle: q.materialTitle || q.material_title || '给定资料',
    material: q.material || '',
    referenceAnswer: q.referenceAnswer || q.reference_answer || '',
    solution: q.solution || q.analysis || '',
    keyExpressions: (Object.prototype.toString.call(kes) === '[object Array]' ? kes : []).slice(0, 60)
  };
}
function slCollect() {
  var pools = [], i;
  var names = ['INLINE_SHENLUN_BANK', 'SHENLUN_BANK', 'SL_QUESTIONS', 'SHENLUN_QUESTIONS', 'shenlun_questions'];
  for (i = 0; i < names.length; i++) {
    try { if (window[names[i]] && window[names[i]].length) pools.push(window[names[i]]); } catch (e) { /* 忽略 */ }
  }
  try { if (typeof EXAM_BANK !== 'undefined' && EXAM_BANK && EXAM_BANK.length) pools.push(EXAM_BANK); } catch (e) { /* 忽略 */ }
  try { if (window.EXAM_BANK && window.EXAM_BANK.length && pools.indexOf(window.EXAM_BANK) < 0) pools.push(window.EXAM_BANK); } catch (e) { /* 忽略 */ }
  var lsKeys = ['shenlun_questions', 'shenlun-questions', 'SHENLUN_BANK'];
  for (i = 0; i < lsKeys.length; i++) {
    try {
      var raw = localStorage.getItem(lsKeys[i]);
      if (raw) { var p = JSON.parse(raw); if (p && p.length) pools.push(p); }
    } catch (e) { /* 忽略 */ }
  }
  var out = [], seen = {};
  for (i = 0; i < pools.length; i++) {
    var arr = pools[i] || [];
    for (var j = 0; j < arr.length; j++) {
      var q = arr[j];
      if (!slIsShenlun(q)) continue;
      var id = String(q.id || q.qid || '');
      if (!id) id = 'sl_auto_' + i + '_' + j;
      if (seen[id]) continue;
      seen[id] = 1;
      out.push(slNorm(q, i + '_' + j));
    }
  }
  return out;
}
function slLoadData() {
  var d = slCollect();
  var changed = (d.length !== SL.data.length);
  SL.data = d;
  if (SL.data.length) {
    if (!slCur() && SL.data[0]) { SL.qid = SL.data[0].id; SL.mid = SL.data[0].id; }
    changed = true;
  }
  return changed;
}
function slBootstrap() {
  slLoadData();
  slRenderAll();
  // 题库可能由 app.js 异步注入，做几次兜底重试
  var delays = [400, 1200, 2600, 5000];
  delays.forEach(function (ms) {
    setTimeout(function () {
      if (!SL.data.length) {
        if (slLoadData()) slRenderAll();
      }
    }, ms);
  });
  // 结构化的 JSON 文件（若数据线已产出）
  try {
    if (typeof fetch === 'function') {
      fetch('assets/data/shenlun-questions.json').then(function (r) {
        if (!r || !r.ok) return null;
        return r.json();
      }).then(function (j) {
        if (j && j.length && !SL.data.length) {
          window.SL_QUESTIONS = j;
          if (slLoadData()) slRenderAll();
        }
      }).catch(function () { /* 无此文件时静默 */ });
    }
  } catch (e) { /* 忽略 */ }
}
function slCur() {
  for (var i = 0; i < SL.data.length; i++) if (SL.data[i].id === SL.qid) return SL.data[i];
  return null;
}
function slById(id) {
  for (var i = 0; i < SL.data.length; i++) if (SL.data[i].id === id) return SL.data[i];
  return null;
}
function slStatus(q) {
  var a = slAns(q.id);
  if (!a || !a.answer) return '未开始';
  return a.status === '已完成' ? '已完成' : '作答中';
}
function slTopicOf(q) { return (q && q.topic) ? q.topic : '其他'; }

/* ---------------- 视图切换 ---------------- */
function slSwitchTab(n) {
  SL.tab = n;
  var b1 = document.getElementById('slTab1Btn'), b2 = document.getElementById('slTab2Btn');
  if (b1) b1.classList.toggle('active', n === 1);
  if (b2) b2.classList.toggle('active', n === 2);
  var t1 = document.getElementById('slTab1Body'), t2 = document.getElementById('slTab2Body');
  if (t1) t1.style.display = n === 1 ? '' : 'none';
  if (t2) t2.style.display = n === 2 ? '' : 'none';
  if (n === 1) slShow1(SL.v1); else slShow2(SL.v2);
}
function slShow1(v) {
  SL.v1 = v;
  var ids = ['slViewList', 'slViewAnswer', 'slViewReview'];
  for (var i = 0; i < ids.length; i++) {
    var el = document.getElementById(ids[i]);
    if (el) el.style.display = (ids[i] === 'slView' + v.charAt(0).toUpperCase() + v.slice(1)) ? '' : 'none';
  }
  if (v === 'list') slRenderList();
  else if (v === 'answer') slRenderAnswer();
  else slRenderReview();
}
function slShow2(v) {
  SL.v2 = v;
  var map = { home: 'slViewReadHome', list: 'slViewMatList', detail: 'slViewMatDetail', expr: 'slViewExpr' };
  for (var k in map) {
    var el = document.getElementById(map[k]);
    if (el) el.style.display = (k === v) ? '' : 'none';
  }
  if (v === 'home') slRenderReadHome();
  else if (v === 'list') slRenderMatList();
  else if (v === 'detail') slRenderMatDetail();
  else slRenderExpr();
}
function slRenderAll() {
  if (SL.tab === 1) slShow1(SL.v1); else slShow2(SL.v2);
}

/* ---------------- Tab1 · 题目列表页 ---------------- */
function slFiltered() {
  var out = [];
  for (var i = 0; i < SL.data.length; i++) {
    var q = SL.data[i];
    if (SL.fType !== '全部' && q.type !== SL.fType) continue;
    if (SL.fSub !== '全部' && q.subType !== SL.fSub) continue;
    if (SL.fTopic !== '全部' && slTopicOf(q) !== SL.fTopic) continue;
    out.push(q);
  }
  return out;
}
function slSubOptions() {
  if (SL.fType !== '全部' && SUB_MAP[SL.fType]) return SUB_MAP[SL.fType];
  return SUB_MAP['单一题'].concat(SUB_MAP['综合题'], SUB_MAP['公文题']);
}
function slRenderList() {
  var box = document.getElementById('slViewList');
  if (!box) return;
  if (!SL.data.length) {
    box.innerHTML =
      '<div class="sl-empty">' +
      '<div class="sl-ei"><span class="nav-icon" data-icon="file-text" data-icon-size="44"></span></div>' +
      '<div class="sl-et">暂无题目，题库导入中</div>' +
      '<div class="sl-desc">申论题库结构化完成后会自动出现在这里，可稍后点下方按钮重新检测。</div>' +
      '<button class="btn btn-primary btn-sm" type="button" data-act="reload">重新检测题库</button>' +
      '</div>';
    slIcons();
    return;
  }
  var list = slFiltered();
  SL.list = list;
  var done = 0;
  for (var i = 0; i < list.length; i++) if (slStatus(list[i]) === '已完成') done++;

  var types = ['全部'].concat(MAIN_TYPES);
  var typeChips = '';
  for (i = 0; i < types.length; i++) {
    typeChips += '<span class="type-filter' + (SL.fType === types[i] ? ' active' : '') + '" data-act="f-type" data-v="' + slEsc(types[i]) + '">' + slEsc(types[i]) + '</span>';
  }
  var subs = slSubOptions();
  var subOpts = '<option value="全部">全部子题型</option>';
  for (i = 0; i < subs.length; i++) {
    subOpts += '<option value="' + slEsc(subs[i]) + '"' + (SL.fSub === subs[i] ? ' selected' : '') + '>' + slEsc(subs[i]) + '</option>';
  }
  if (SL.fSub !== '全部' && subs.indexOf(SL.fSub) < 0) {
    subOpts += '<option value="' + slEsc(SL.fSub) + '" selected>' + slEsc(SL.fSub) + '</option>';
  }
  var topicOpts = '<option value="全部">全部主题</option>';
  for (i = 0; i < TOPICS.length; i++) {
    topicOpts += '<option value="' + slEsc(TOPICS[i]) + '"' + (SL.fTopic === TOPICS[i] ? ' selected' : '') + '>' + slEsc(TOPICS[i]) + '</option>';
  }

  var cards = '';
  for (i = 0; i < list.length; i++) {
    var q = list[i], st = slStatus(q), a = slAns(q.id) || {};
    var badge = st === '已完成' ? '<span class="tag tag-success">已完成</span>'
      : (st === '作答中' ? '<span class="tag tag-warning">作答中</span>' : '<span class="tag">未开始</span>');
    var btns = '';
    if (st === '未开始') {
      btns = '<button class="btn btn-primary btn-sm" type="button" data-act="start" data-id="' + slEsc(q.id) + '">开始作答</button>';
    } else if (st === '作答中') {
      btns = '<button class="btn btn-primary btn-sm" type="button" data-act="start" data-id="' + slEsc(q.id) + '">继续作答</button>' +
        '<button class="btn btn-outline btn-sm" type="button" data-act="reset" data-id="' + slEsc(q.id) + '">重新开始</button>';
    } else {
      btns = '<button class="btn btn-secondary btn-sm" type="button" data-act="review" data-id="' + slEsc(q.id) + '">查看复盘</button>' +
        '<button class="btn btn-outline btn-sm" type="button" data-act="reset" data-id="' + slEsc(q.id) + '">重新开始</button>';
    }
    var favTxt = slIsFav(q.id) ? '已收藏' : '收藏';
    cards +=
      '<div class="sl-qcard">' +
      '<div class="sl-qtitle">' + slEsc((q.source || '真题') + ' · ' + (q.questionNo || '题目')) + '</div>' +
      '<div class="sl-tags">' +
      '<span class="tag tag-primary">' + slEsc(q.type) + (q.subType ? '·' + slEsc(q.subType) : '') + '</span>' +
      '<span class="tag">' + slEsc(slTopicOf(q)) + '</span>' +
      (q.score ? '<span class="tag tag-warning">' + slEsc(q.score) + '分</span>' : '') +
      (q.wordLimit ? '<span class="tag">≤' + slEsc(q.wordLimit) + '字</span>' : '') +
      '</div>' +
      (q.requirement ? '<div class="sl-qreq">' + slEsc(q.requirement) + '</div>' : '') +
      '<div class="sl-status">状态：' + badge +
      (a.chars ? '<span style="margin-left:8px;color:var(--text-muted)">已写 ' + slEsc(a.chars) + ' 字</span>' : '') +
      '</div>' +
      '<div class="sl-actions">' +
      '<button class="sl-mini" type="button" data-act="favq" data-id="' + slEsc(q.id) + '">' + favTxt + '</button>' +
      btns + '</div>' +
      '</div>';
  }
  if (!cards) {
    cards = '<div class="sl-empty"><div class="sl-ei"><span class="nav-icon" data-icon="search" data-icon-size="40"></span></div>' +
      '<div class="sl-et">没有符合条件的题目</div><div class="sl-desc">换个题型或主题试试</div></div>';
  }

  box.innerHTML =
    '<div class="card-header"><div class="card-title"><span class="title-icon" data-icon="pencil"></span>题目精练</div>' +
    '<div><span class="tag tag-primary">共 ' + SL.data.length + ' 题</span></div></div>' +
    '<div style="padding:0 16px 16px">' +
    '<div class="sl-filter-row" style="margin-top:12px">' + typeChips + '</div>' +
    '<div class="sl-filter-row">' +
    '<select class="form-input sl-select" data-act="f-sub">' + subOpts + '</select>' +
    '<span class="sl-lab">主题</span>' +
    '<select class="form-input sl-select" data-act="f-topic">' + topicOpts + '</select>' +
    '</div>' +
    '<div class="sl-meta">共 ' + list.length + ' 题 · 已完成 ' + done + ' 题</div>' +
    cards +
    '</div>';
  slIcons();
}

/* ---------------- Tab1 · 作答页 ---------------- */
function slParas(text) {
  var parts = String(text || '').split(/\n+/);
  var html = '';
  for (var i = 0; i < parts.length; i++) {
    var t = parts[i].trim();
    if (t) html += '<p>' + slEsc(t) + '</p>';
  }
  return html || '<p style="color:var(--text-muted)">（本题暂无给定材料）</p>';
}
function slRenderAnswer() {
  var q = slCur();
  var box = document.getElementById('slViewAnswer');
  if (!box) return;
  if (!q) {
    box.innerHTML = '<div class="sl-empty"><div class="sl-et">暂无题目，题库导入中</div>' +
      '<button class="btn btn-outline btn-sm" type="button" data-act="back-list">返回列表</button></div>';
    slIcons();
    return;
  }
  var a = slAns(q.id) || {};
  var title = (q.source || '真题') + ' · ' + (q.questionNo || '题目');
  box.innerHTML =
    '<div class="sl-head">' +
    '<span class="sl-back" data-act="back-list" title="返回列表（作答自动保存）"><span class="nav-icon" data-icon="arrow-left" data-icon-size="18"></span> 返回列表</span>' +
    '<div class="sl-htitle">' + slEsc(title) + '</div>' +
    (q.score ? '<span class="tag tag-warning">' + slEsc(q.score) + '分</span>' : '') +
    (q.wordLimit ? '<span class="tag tag-primary">≤' + slEsc(q.wordLimit) + '字</span>' : '') +
    '<button class="btn btn-primary btn-sm" type="button" data-act="a-submit">交卷</button>' +
    '</div>' +
    '<div class="sl-split">' +
    '<div class="sl-col sl-mat" id="slMatCol">' +
    '<div class="sl-mat-head"><span class="nav-icon" data-icon="file-text" data-icon-size="16"></span>' +
    '<span>' + slEsc(q.materialTitle) + '</span><span class="sl-sp"></span>' +
    '<span class="sl-mini-btn" data-act="a-collapse" id="slCollapseBtn">收起</span></div>' +
    '<div class="sl-mat-body" id="slMatBody" data-slmaterial="1" data-qid="' + slEsc(q.id) + '">' + slParas(q.material) + '</div>' +
    '</div>' +
    '<div class="sl-col sl-ans">' +
    '<div class="sl-tags">' +
    '<span class="tag tag-primary">' + slEsc(q.type) + (q.subType ? '·' + slEsc(q.subType) : '') + '</span>' +
    '<span class="tag">' + slEsc(slTopicOf(q)) + '</span>' +
    '</div>' +

    topicChips += '<span class="sl-chip' + (SL.exprTopic === tops[i] ? ' active' : '') + '" data-act="e-topic" data-v="' + slEsc(tops[i]) + '">' + slEsc(tops[i]) + '</span>';
  }
  var cats = ['全部', '规范词', '金句'];
  var catChips = '';
  for (i = 0; i < cats.length; i++) {
    catChips += '<span class="sl-chip' + (SL.exprCat === cats[i] ? ' active' : '') + '" data-act="e-cat" data-v="' + slEsc(cats[i]) + '">' + slEsc(cats[i]) + '</span>';
  }
  var topicOpts = '';
  for (i = 0; i < TOPICS.length; i++) topicOpts += '<option value="' + slEsc(TOPICS[i]) + '">' + slEsc(TOPICS[i]) + '</option>';
  box.innerHTML =
    '<div class="sl-head">' +
    '<span class="sl-back" data-act="back-home"><span class="nav-icon" data-icon="arrow-left" data-icon-size="18"></span> 返回</span>' +
    '<div class="sl-htitle"><span class="nav-icon" data-icon="sparkles" data-icon-size="18"></span>规范表达积累本</div>' +
    '<span class="tag tag-primary">共 ' + all.length + ' 条</span>' +
    '</div>' +
    '<div style="padding:12px 16px 16px">' +
    '<input class="form-input" id="slExprSearch" placeholder="搜索表达内容或来源…" data-act="e-search" value="' + slEsc(SL.exprKw) + '">' +
    '<div class="sl-chips" style="margin-top:12px">' + topicChips + '</div>' +
    '<div class="sl-chips">' + catChips + '</div>' +
    '<div id="slExprGrid"></div>' +
    (SL.addForm ?
      '<div class="sl-addform">' +
      '<div class="form-group"><div class="form-label">表达内容</div>' +
      '<textarea class="sl-note" id="slNewExpr" placeholder="如：构建长效机制、打通最后一公里"></textarea></div>' +
      '<div class="sl-inline">' +
      '<select class="form-input sl-select" id="slNewTopic">' + topicOpts + '</select>' +
      '<select class="form-input sl-select" id="slNewCat"><option value="规范词">规范词</option><option value="金句">金句</option></select>' +
      '<input class="form-input sl-select" id="slNewSrc" placeholder="来源（选填）">' +
      '</div>' +
      '<div style="margin-top:10px;display:flex;gap:8px">' +
      '<button class="btn btn-primary btn-sm" type="button" data-act="add-expr-save">保存</button>' +
      '<button class="btn btn-outline btn-sm" type="button" data-act="add-expr-cancel">取消</button>' +
      '</div></div>'
      : '<div style="margin-top:12px"><button class="btn btn-primary btn-sm" type="button" data-act="add-expr-toggle">+ 添加新表达</button></div>') +
    '</div>';
  slRenderExprGrid();
  slIcons();
}
function slRenderExprGrid() {
  var box = document.getElementById('slExprGrid');
  if (!box) return;
  var list = slExprFiltered();
  if (!list.length) {
    box.innerHTML = '<div class="sl-empty" style="padding:32px"><div class="sl-ei"><span class="nav-icon" data-icon="sparkles" data-icon-size="40"></span></div>' +
      '<div class="sl-et">' + (slExprs().length ? '没有符合筛选条件的表达' : '积累本还是空的') + '</div>' +
      '<div class="sl-desc">在阅读材料和参考答案时选中文字，点「加入积累本」即可沉淀</div></div>';
    slIcons();
    return;
  }
  var html = '<div class="sl-grid2">';
  for (var i = 0; i < list.length; i++) {
    var e = list[i];
    html += '<div class="sl-expr">' +
      '<div class="sl-tags"><span class="tag ' + (e.category === '金句' ? 'tag-warning' : 'tag-primary') + '">' + slEsc(e.category || '规范词') + '</span>' +
      '<span class="tag">' + slEsc(e.topic || '其他') + '</span></div>' +
      '<div class="sl-econtent">' + slEsc(e.content || '') + '</div>' +
      '<div class="sl-esrc">来源：' + slEsc(e.source || '手动添加') + '</div>' +
      '<div class="sl-expr-acts">' +
      '<button class="sl-mini" type="button" data-act="copy-expr" data-id="' + slEsc(e.id || '') + '">复制</button>' +
      '<button class="sl-mini" type="button" data-act="del-expr" data-id="' + slEsc(e.id || '') + '">删除</button>' +
      '</div></div>';
  }
  html += '</div>';
  box.innerHTML = html;
}
function slCopy(text) {
  try {
    if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { slToast('已复制'); }, function () { slCopyFallback(text); });
      return;
    }
  } catch (e) { /* 继续兜底 */ }
  slCopyFallback(text);
}
function slCopyFallback(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    slToast(ok ? '已复制' : '复制失败，请手动选择文本');
  } catch (e) { slToast('复制失败，请手动选择文本'); }
}

/* ---------------- 高亮 ---------------- */
function slApplyHL(root, list) {
  if (!root || !list || !list.length) return;
  for (var i = 0; i < list.length; i++) {
    var t = String(list[i] || '').trim();
    if (!t) continue;
    try { slWrapFirst(root, t); } catch (e) { /* 单条高亮失败不影响其它 */ }
  }
}
function slWrapFirst(root, t) {
  if (!document.createTreeWalker || !NodeFilter) return;
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
  var node;
  while ((node = walker.nextNode())) {
    if (node.parentNode && node.parentNode.className === 'sl-hl') continue;
    var idx = node.nodeValue.indexOf(t);
    if (idx >= 0) {
      var range = document.createRange();
      range.setStart(node, idx);
      range.setEnd(node, idx + t.length);
      var mark = document.createElement('mark');
      mark.className = 'sl-hl';
      try { range.surroundContents(mark); }
      catch (err) { var frag = range.extractContents(); mark.appendChild(frag); range.insertNode(mark); }
      return;
    }
  }
}
function slCollectHL(root) {
  if (!root) return [];
  var marks = root.getElementsByTagName('mark'), out = [];
  for (var i = 0; i < marks.length; i++) {
    var t = String(marks[i].textContent || '').trim();
    if (t && out.indexOf(t) < 0) out.push(t);
  }
  return out;
}
function slSelText() {
  try {
    var s = window.getSelection();
    if (!s || !s.rangeCount) return '';
    return String(s).trim();
  } catch (e) { return ''; }
}
function slDoHighlight() {
  var txt = slSelText();
  var bar = document.getElementById('slSelBar');
  var host = bar && bar.getAttribute('data-host');
  var root = host ? document.getElementById(host) : null;
  if (!txt || !root) { slToast('请先选中材料中的文字'); return; }
  var sel = window.getSelection();
  if (!sel.rangeCount) return;
  var range = sel.getRangeAt(0);
  var mark = document.createElement('mark');
  mark.className = 'sl-hl';
  try { range.surroundContents(mark); }
  catch (e) {
    try { var frag = range.extractContents(); mark.appendChild(frag); range.insertNode(mark); }
    catch (e2) { slToast('这段选区无法高亮，请少选一些文字'); return; }
  }
  sel.removeAllRanges();
  if (bar) bar.classList.remove('on');
  var qid = root.getAttribute('data-qid');
  if (qid) slSetRead(qid + '_material', { highlights: slCollectHL(root) });
  slToast('已高亮');
}
function slSelAddExpr() {
  var txt = slSelText();
  var bar = document.getElementById('slSelBar');
  if (!txt) { slToast('请先选中要积累的文字'); return; }
  var qid = bar ? bar.getAttribute('data-qid') : '';
  var q = slById(qid);
  slAddExpr({
    topic: q ? slTopicOf(q) : '其他',
    category: txt.length > 18 ? '金句' : '规范词',
    content: txt,
    source: q ? ((q.source || '真题') + ' · ' + q.materialTitle) : '材料阅读'
  });
  if (bar) bar.classList.remove('on');
  try { window.getSelection().removeAllRanges(); } catch (e) { /* 忽略 */ }
}

/* ---------------- 轻弹层：确认 / 勾选 ---------------- */
function slConfirm(title, msg, okText, cb) {
  SL.confirmCb = cb;
  var ov = document.getElementById('slConfirmOv');
  var t = document.getElementById('slConfirmTitle');
  var m = document.getElementById('slConfirmMsg');
  var ok = document.getElementById('slConfirmOk');
  if (t) t.textContent = title;
  if (m) m.textContent = msg;
  if (ok) ok.textContent = okText || '确定';
  if (ov) ov.classList.add('on');
}
function slCloseConfirm() {
  var ov = document.getElementById('slConfirmOv');
  if (ov) ov.classList.remove('on');
  SL.confirmCb = null;
}
function slOpenSheet() {
  var q = slCur();
  if (!q) return;
  var cands = [], i;
  var kes = q.keyExpressions || [];
  for (i = 0; i < kes.length; i++) if (kes[i] && cands.indexOf(kes[i]) < 0) cands.push(kes[i]);
  var sents = String(q.referenceAnswer || '').split(/[。；\n！？]/);
  for (i = 0; i < sents.length; i++) {
    var s = String(sents[i] || '').trim();
    if (s.length >= 6 && s.length <= 40 && cands.indexOf(s) < 0) cands.push(s);
  }
  cands = cands.slice(0, 40);
  if (!cands.length) { slToast('这道题还没有可提取的规范表达'); return; }
  var html = '';
  for (i = 0; i < cands.length; i++) {
    html += '<label class="sl-ck"><input type="checkbox" value="' + slEsc(cands[i]) + '" checked><span>' + slEsc(cands[i]) + '</span></label>';
  }
  var list = document.getElementById('slSheetList');
  var ov = document.getElementById('slSheetOv');
  if (list) list.innerHTML = html;
  if (ov) ov.classList.add('on');
}
function slSheetOk() {
  var q = slCur();
  var list = document.getElementById('slSheetList');
  var ov = document.getElementById('slSheetOv');
  if (!q || !list) return;
  var boxes = list.getElementsByTagName('input'), n = 0;
  for (var i = 0; i < boxes.length; i++) {
    if (boxes[i].checked) {
      slAddExpr({
        topic: slTopicOf(q),
        category: boxes[i].value.length > 18 ? '金句' : '规范词',
        content: boxes[i].value,
        source: (q.source || '真题') + ' · ' + (q.questionNo || '题目')
      });
      n++;
    }
  }
  if (ov) ov.classList.remove('on');
  slToast(n ? '已加入 ' + n + ' 条表达' : '没有选择任何表达');
}

/* ---------------- 交互入口 ---------------- */
function slGoQuestion(id) {
  SL.qid = id;
  SL.tab = 1;
  var b1 = document.getElementById('slTab1Btn'), b2 = document.getElementById('slTab2Btn');
  if (b1) b1.classList.add('active');
  if (b2) b2.classList.remove('active');
  var t1 = document.getElementById('slTab1Body'), t2 = document.getElementById('slTab2Body');
  if (t1) t1.style.display = '';
  if (t2) t2.style.display = 'none';
  slShow1('answer');
}
function slBackList() {
  var ta = document.getElementById('slAnswerBox');
  if (ta) slFlush();
  slShow1('list');
}
function slBackMatList() {
  var box = document.getElementById('slMatNote');
  if (box) slSaveMatNote();
  slShow2('list');
}

// 事件委托：从 e.target 向上找到最近的可操作元素（SVG 内部也可能成为 target）
function slResolve(e) {
  var node = e.target, el = null, act = null;
  while (node && node !== document) {
    if (node.getAttribute) {
      var a = node.getAttribute('data-act');
      if (a) { el = node; act = a; break; }
      if (!el && (node.id === 'slTab1Btn' || node.id === 'slTab2Btn')) { el = node; }
    }
    node = node.parentNode;
  }
  return { el: el, act: act };
}
function slResolveAct(e) {
  var node = e.target;
  while (node && node !== document) {
    if (node.getAttribute) {
      var a = node.getAttribute('data-act');
      if (a) return { el: node, act: a };
    }
    node = node.parentNode;
  }
  return { el: null, act: null };
}
document.addEventListener('click', function (e) {
  var r = slResolve(e);
  var el = r.el, act = r.act;
  if (!el) return;
  if (!act) {
    // Tab 切换（整块可点，含内部图标）
    if (el.id === 'slTab1Btn') { slSwitchTab(1); return; }
    if (el.id === 'slTab2Btn') { slSwitchTab(2); return; }
    return;
  }
  var id = el.getAttribute('data-id') || '';
  var v = el.getAttribute('data-v') || '';
  switch (act) {
    case 'f-type':
      SL.fType = v; SL.fSub = '全部'; slRenderList(); break;
    case 'reload':
      if (slLoadData()) { slToast('题库已更新'); } else { slToast('暂无题目，题库导入中'); }
      slRenderAll(); break;
    case 'start':
      SL.qid = id; slShow1('answer'); break;
    case 'review':
      SL.qid = id; slShow1('review'); break;
    case 'reset':
      slConfirm('重新开始？', '将清空本题的作答内容与笔记，重新开始作答。', '清空重做', function () {
        slDelAns(id);
        SL.qid = id;
        slToast('已清空，重新开始');
        slShow1('answer');
      });
      break;
    case 'favq':
      slToggleFav(id); slToast(slIsFav(id) ? '已收藏' : '已取消收藏'); slRenderList(); break;
    case 'favq-here':
      SL.qid = SL.qid; slToggleFav(SL.qid); slToast(slIsFav(SL.qid) ? '已收藏' : '已取消收藏'); slRenderReview(); break;
    case 'back-list':
      slBackList(); break;
    case 'a-submit':
      slSubmit(); break;
    case 'a-collapse':
      var col = document.getElementById('slMatCol'), btn = document.getElementById('slCollapseBtn');
      if (col) {
        col.classList.toggle('collapsed');
        if (btn) btn.textContent = col.classList.contains('collapsed') ? '展开' : '收起';
      }
      break;
    case 'save-note':
      slSaveNote(); break;
    case 'prev-q':
      slNeighbor(-1); break;
    case 'next-q':
      slNeighbor(1); break;
    case 'add-expr':
      slOpenSheet(); break;
    case 'sheet-cancel':
      document.getElementById('slSheetOv').classList.remove('on'); break;
    case 'sheet-ok':
      slSheetOk(); break;
    case 'confirm-cancel':
      slCloseConfirm(); break;
    case 'ke':
      var q = slCur();
      slAddExpr({
        topic: q ? slTopicOf(q) : '其他',
        category: String(el.textContent || '').length > 18 ? '金句' : '规范词',
        content: String(el.textContent || '').trim(),
        source: q ? ((q.source || '真题') + ' · ' + (q.questionNo || '题目')) : '参考答案'
      });
      break;
    case 'go-matlist':
      SL.matMode = v || 'topic'; slShow2('list'); break;
    case 'go-expr':
      slShow2('expr'); break;
    case 'back-home':
      slShow2('home'); break;
    case 'm-mode':
      SL.matMode = v; slRenderMatList(); break;
    case 'm-topic':
      SL.matTopic = v; slRenderMatList(); break;
    case 'm-type':
      SL.matType = v; slRenderMatList(); break;
    case 'open-mat':
      SL.mid = id; slShow2('detail'); break;
    case 'go-do':
      slGoQuestion(id); break;
    case 'back-matlist':
      slBackMatList(); break;
    case 'fav-mat':
      slToggleFav('m_' + id); slToast(slIsFav('m_' + id) ? '已收藏' : '已取消收藏'); slRenderMatDetail(); break;
    case 'save-matnote':
      slSaveMatNote(); break;
    case 'e-topic':
      SL.exprTopic = v; slRenderExpr(); break;
    case 'e-cat':
      SL.exprCat = v; slRenderExpr(); break;
    case 'copy-expr':
      var arr = slExprs();
      for (var i = 0; i < arr.length; i++) if (arr[i].id === id) { slCopy(arr[i].content || ''); break; }
      break;
    case 'del-expr':
      slConfirm('删除这条表达？', '删除后不可恢复。', '删除', function () {
        var a = slExprs();
        for (var j = 0; j < a.length; j++) {
          if (a[j].id === id) { a.splice(j, 1); break; }
        }
        slSaveExprs(a);
        slToast('已删除');
        slRenderExpr();
      });
      break;
    case 'add-expr-toggle':
      SL.addForm = true; slRenderExpr(); break;
    case 'add-expr-cancel':
      SL.addForm = false; slRenderExpr(); break;
    case 'add-expr-save':
      var c = document.getElementById('slNewExpr');
      var tp = document.getElementById('slNewTopic');
      var ct = document.getElementById('slNewCat');
      var sc = document.getElementById('slNewSrc');
      var content = c ? String(c.value || '').trim() : '';
      if (!content) { slToast('请输入表达内容'); break; }
      slAddExpr({
        topic: tp ? tp.value : '其他',
        category: ct ? ct.value : '规范词',
        content: content,
        source: sc ? String(sc.value || '').trim() : '手动添加'
      });
      SL.addForm = false;
      slRenderExpr();
      break;
    case 'toggle-fav':
      SL.showFav = !SL.showFav; slRenderReadHome(); break;
    case 'sel-hl':
      slDoHighlight(); break;
    case 'sel-add':
      slSelAddExpr(); break;
    default:
      break;
  }
});

document.addEventListener('input', function (e) {
  var r = slResolveAct(e);
  var el = r.el, act = r.act;
  if (!el || !act) return;
  if (act === 'answer-input') slOnAnswerInput();
  else if (act === 'home-search') { SL.homeKw = el.value; slRenderHomeResults(); }
  else if (act === 'e-search') { SL.exprKw = el.value; slRenderExprGrid(); }
  else if (act === 'matnote-input') { /* 笔记失焦或点保存时写入 */ }
});

document.addEventListener('change', function (e) {
  var r = slResolveAct(e);
  var el = r.el, act = r.act;
  if (!el || !act) return;
  if (act === 'f-sub') { SL.fSub = el.value; slRenderList(); }
  else if (act === 'f-topic') { SL.fTopic = el.value; slRenderList(); }
});

/* 选中文字工具条：只有「高亮」和「加入积累本」两个操作 */
document.addEventListener('mouseup', function (e) {
  setTimeout(function () {
    var bar = document.getElementById('slSelBar');
    if (!bar) return;
    var txt = slSelText();
    if (!txt || txt.length < 2) { bar.classList.remove('on'); return; }
    var node = e.target, host = null;
    while (node && node !== document) {
      if (node.getAttribute && node.getAttribute('data-slmaterial')) { host = node; break; }
      node = node.parentNode;
    }
    if (!host) { bar.classList.remove('on'); return; }
    if (!host.getAttribute('id')) host.setAttribute('id', 'slMatHost');
    var sel = window.getSelection();
    if (!sel.rangeCount) { bar.classList.remove('on'); return; }
    var left = window.innerWidth / 2 - 80, top = 80;
    try {
      var r = sel.getRangeAt(0).getBoundingClientRect();
      if (r && (r.left || r.top || r.width)) { left = r.left + r.width / 2 - 80; top = r.top - 46; }
    } catch (err) { /* 取不到位置时用默认位置 */ }
    bar.setAttribute('data-host', host.getAttribute('id'));
    bar.setAttribute('data-qid', host.getAttribute('data-qid') || (SL.v1 === 'answer' ? SL.qid : SL.mid) || '');
    bar.style.left = Math.max(8, Math.min(window.innerWidth - 180, left)) + 'px';
    bar.style.top = Math.max(8, top) + 'px';
    bar.classList.add('on');
  }, 0);
});
document.addEventListener('mousedown', function (e) {
  var bar = document.getElementById('slSelBar');
  if (!bar) return;
  if (bar.contains && e.target && bar.contains(e.target)) return;
  bar.classList.remove('on');
});

/* 确认弹层的确定按钮 */
document.addEventListener('DOMContentLoaded', function () {
  var ok = document.getElementById('slConfirmOk');
  if (ok) {
    ok.addEventListener('click', function () {
      var cb = SL.confirmCb;
      slCloseConfirm();
      if (typeof cb === 'function') cb();
    });
  }
  var ovC = document.getElementById('slConfirmOv');
  if (ovC) ovC.addEventListener('click', function (e) { if (e.target === ovC) slCloseConfirm(); });
  var ovS = document.getElementById('slSheetOv');
  if (ovS) ovS.addEventListener('click', function (e) { if (e.target === ovS) ovS.classList.remove('on'); });

  slBootstrap();
  // 顶部标题
  var tt = document.getElementById('topbarTitle');
  if (tt) tt.textContent = '申论学习';
});
window.addEventListener('load', function () {
  if (!SL.data.length && slLoadData()) slRenderAll();
});
