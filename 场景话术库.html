<style>
/* ============================================================
   场景话术库 · 布局重排（只动布局与样式，不动任何 id / onclick / 渲染逻辑）
   间距体系：8 / 12 / 16（--xt-space-2 / 3 / 4）
   ============================================================ */

/* —— 页面容器：与 .content 同级页保持一致的留白 —— */
#page-comm-scenes { padding: 24px; }
#page-comm-scenes > .card { padding: 16px; margin-bottom: 0; }

/* —— 页头：标题 + 数量标签，换行时仍保持 8/16 节奏 —— */
#page-comm-scenes .card-header { margin-bottom: 16px; gap: 8px; flex-wrap: wrap; }
#page-comm-scenes .card-header .card-title { font-size: 16px; gap: 8px; min-width: 0; }
#page-comm-scenes .card-header .card-title .title-icon { display: inline-flex; align-items: center; }
#page-comm-scenes .card-header .tag { flex-shrink: 0; }

/* —— 分类 tab 行：与卡片网格左对齐，间距 8 —— */
#commFilter { gap: 8px !important; margin-bottom: 16px !important; }
#commFilter .type-filter { line-height: 1.4; }

/* —— 内容区：卡片网格，同行等高 —— */
#commSceneList {
  display: grid !important;
  grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
  gap: 16px !important;
  align-items: stretch;
}
/* 统计条 / 分类小标题 / 空态：独占整行 */
#commSceneList > .cs-stats,
#commSceneList > .cs-section,
#commSceneList > .cs-empty { grid-column: 1 / -1; }

#commSceneList > .cs-stats { padding: 12px 16px !important; margin-bottom: 0 !important; gap: 12px !important; border-radius: 12px !important; }
/* 13px = 3px 竖线 + 与卡片内边距 16px 对齐 */
#commSceneList > .cs-section { margin: 4px 0 0 !important; padding-left: 13px !important; }
#commSceneList > .cs-empty { padding: 32px 16px !important; margin-bottom: 0 !important; border-radius: 12px !important; }

/* —— 场景卡：图标 + 标题 + 描述层次统一，hover 与全站 .card 一致 —— */
#commSceneList > .cs-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 16px !important;
  margin-bottom: 0 !important;
  border-radius: 12px !important;
  box-shadow: var(--shadow);
  transition: box-shadow 0.25s ease, transform 0.25s ease;
}
#commSceneList > .cs-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
/* 1 图标+标题行 / 2 场景 / 3 低·高情商对比 / 4 沟通要点 */
#commSceneList > .cs-card > div:nth-child(1) { gap: 8px !important; margin-bottom: 12px !important; flex-wrap: wrap; }
#commSceneList > .cs-card > div:nth-child(1) > span:first-child { display: inline-flex; align-items: center; line-height: 1; }
#commSceneList > .cs-card > div:nth-child(1) > .btn:first-of-type { margin-left: auto; }
#commSceneList > .cs-card > div:nth-child(2) { padding: 12px !important; margin-bottom: 12px !important; border-radius: 12px !important; }
#commSceneList > .cs-card > div:nth-child(3) { gap: 12px !important; margin-bottom: 12px !important; }
#commSceneList > .cs-card > div:nth-child(3) > div { padding: 12px !important; border-radius: 12px !important; }
#commSceneList > .cs-card > div:nth-child(4) { margin-top: auto; }

/* —— 窄屏/中屏：单列（低于 2 列所需宽度 520*2+16+侧栏 220+留白 48） —— */
@media (max-width: 1323px) {
  #commSceneList { grid-template-columns: 1fr; }
}
/* —— 手机：留白收紧 + 对比块纵向排列 —— */
@media (max-width: 768px) {
  #page-comm-scenes { padding: 16px; padding-bottom: calc(var(--bottom-nav-height) + 20px); }
  #commSceneList { grid-template-columns: 1fr; }
  #commSceneList > .cs-card > div:nth-child(3) { grid-template-columns: 1fr !important; }
}
/* ===== R73 需求20-B 移动端适配（≤768px）=====
   仅作用于窄屏；桌面端(>768px)渲染零影响（本块整体位于媒体查询内）。
   1) 内嵌媒体兜底 max-width，防 JS 注入内容/未来素材撑破窄屏；
   2) 宽表格窄屏内横向滚动，避免整页横向溢出（需求20-B #2）；
   3) 字号下限兜底：common.css 的 .bn-label(10px)/.ai-mode-badge(9px)/
      .study-stats-bar b(9px) 低于 A7 辅助≥11px，页内窄屏提升到 11px（不改共享 common.css）。 */
@media (max-width: 768px) {
  img, video, canvas, iframe { max-width: 100%; height: auto; }
  table { display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .bottom-nav-item .bn-label, .ai-mode-badge, .study-stats-bar b { font-size: 11px; }
}
</style>

<script>
/* 场景话术库：为动态渲染的子节点补样式钩子（只加 class，不改数据与交互） */
(function () {
  function tagCommScenes() {
    var list = document.getElementById('commSceneList');
    if (!list) return;
    var kids = list.children;
    for (var i = 0; i < kids.length; i++) {
      var el = kids[i];
      if (el.style.borderRadius === '14px') el.className = 'cs-card';
      else if (el.style.borderLeftWidth === '3px') el.className = 'cs-section';
      else if (el.style.textAlign === 'center') el.className = 'cs-empty';
      else el.className = 'cs-stats';
    }
  }
  tagCommScenes();
  document.addEventListener('DOMContentLoaded', tagCommScenes);
  var list = document.getElementById('commSceneList');
  if (window.MutationObserver && list) {
    new MutationObserver(tagCommScenes).observe(list, { childList: true });
  }
})();
</script>
