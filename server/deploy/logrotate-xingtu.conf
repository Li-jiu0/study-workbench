# 星途服务器日志轮转配置（R9 · 2026-09-21；2026-09-21 部署按生产实况校正）
#
# ⚠️ 生产实况（2026-09-21 只读探针实测）：
#   1) Nginx 访问/错误日志【已由发行版自带 /etc/logrotate.d/nginx 按天轮转】——
#      /var/log/nginx 下已有 access.log.1 与 access.log.2.gz … access.log.10.gz、error.log.1…5.gz。
#      → 本文件【不再】配置 nginx，避免与发行版规则双重轮转。且真实命名是 access.log / error.log，
#        并不是 xingtu-*.log（旧稿按 xingtu-* 写，实际匹配不到、属无效配置）。
#   2) 后端日志走 systemd journal（journalctl -u study-workbench），不落文件系统；
#      /opt/study-workbench/logs/ 目录当前【不存在】。
#      → 后端侧的磁盘上限应由 journald 控制：可在 /etc/systemd/journald.conf 设 SystemMaxUse=500M（可选，需 root）。
#
# 结论：本文件仅在「后端改为把输出重定向到 /opt/study-workbench/logs/」时才需要安装。
# 安装：sudo cp server/deploy/logrotate-xingtu.conf /etc/logrotate.d/xingtu
#       sudo logrotate -d /etc/logrotate.d/xingtu   # dry-run 校验
#       sudo logrotate -f /etc/logrotate.d/xingtu   # 强制执行一次
#
# 《日志问题优化总结》对应：三-1 按大小+按天切割 / 保留份数；三-2 业务与 Nginx 分离。

# ---- 后端应用日志（仅当后端输出重定向到 /opt/study-workbench/logs/ 时生效；否则 missingok 静默跳过）----
/opt/study-workbench/logs/*.log {
    daily
    maxsize 100M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
    su root root
}
