  /* R78：「我的动态」列表按钮（替换原 R74 入口卡）；.xtm-hero 为其外层容器。
     R84：原「换背景 / 恢复默认」两个悬浮按钮、隐藏 file input、遮罩层及其样式已按用户要求删除；
     背景功能逻辑仍保留在 assets/xt-moments.js，待 R80 迁移到 我的动态.html 复用。
     R85：列表行副标题（原为引导去个人中心头像入口的说明文字）已按用户要求删除，
     其专属规则 .xtm-listrow-s 无其它使用者，一并清除；
     行内垂直居中由 .xtm-listrow 的 align-items:center 保证（图标 38px 主导行高），无需额外微调。
     视觉口径与页内 .xtm-card / .xtm-avatar 一致；长度全部固定值，窄屏由页面既有断点接管。 */
  .xtm-hero{position:relative;margin:12px 0 14px;background-size:cover;background-position:center;border-radius:16px}
  .xtm-listrow{display:flex;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);text-decoration:none;color:var(--text);box-sizing:border-box}
  .xtm-listrow-icon{width:38px;height:38px;border-radius:12px;flex-shrink:0;margin-right:10px;background:linear-gradient(135deg,var(--primary-light),#e9ecff);display:flex;align-items:center;justify-content:center;font-size:17px;overflow:hidden}
  .xtm-listrow-main{flex:1;min-width:0}
  .xtm-listrow-t{font-size:14px;font-weight:700;color:var(--text)}
  .xtm-listrow-arrow{color:var(--text-secondary);font-size:20px;flex-shrink:0;padding-left:6px}
  /* R82：lucide 图标适配（沿用页面内联样式口径；等宽描边随语义取色，不改公共 CSS） */
  .xtm-nav-btn .nav-icon, .xtm-listrow-icon .nav-icon{display:flex;align-items:center;justify-content:center}
  .xtm-listrow-icon .nav-icon svg{stroke:var(--primary)}
  .xtm-listrow-arrow .nav-icon{display:flex;align-items:center}
  .xtm-listrow-arrow .nav-icon svg{stroke:var(--text-secondary)}
  /* R131：修复「最后一条动态的操作栏被固定底栏盖住」。
     #page-moments 被内联 display:flex（行向）接管为滚动容器后，.xtm-wrap 默认被
     align-items:stretch 拉到视口高度，其自身 padding-bottom 只落在视口底部而非内容末尾，
     最后一条动态溢出到其后，操作栏无法滚动到固定底栏上方。
     处理：1) 让流内子元素按内容自适应高度（flex-start），.xtm-wrap 原有的
        padding-bottom（xt-moments.css 口径：底栏高 + safe-area + 24px）即可跟随内容生效；
        2) 给滚动容器 #page-moments 自身补一条含 safe-area 的底部留白兜底，
        口径照抄 common.css 中 .main > .page / .content 的现成写法。 */
  #page-moments{align-items:flex-start}
  #page-moments{padding-bottom:calc(var(--bottom-nav-height, 64px) + 20px + env(safe-area-inset-bottom, 0px))}
</style>
