        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px" id="ecTypeFilter">
          <!-- 【2026-09-15 用户指令】题型筛选由两行标签压缩为一个下拉列表，节省纵向空间；
               逻辑不变：仍调 filterExamType(type)（app.js L5763），页尾脚本负责让下拉框与筛选状态双向同步 -->

            <option value="图形推理">图形推理</option>
            <option value="定义判断">定义判断</option>
            <option value="类比推理">类比推理</option>
            <option value="逻辑判断">逻辑判断</option>
            <option value="言语理解">言语理解</option>
            <option value="数量关系">数量关系</option>
            <option value="资料分析">资料分析</option>
          </select>
          <span class="type-filter" style="border:1.5px solid var(--primary);color:var(--primary);background:var(--primary-light)" onclick="openQBank('exam')" title="添加/导入/导出自己的题目"><span data-icon="brain" data-icon-size="16" style="vertical-align:-3px"></span> 我的题库</span>
          <span class="type-filter" style="background:var(--primary);color:#fff;border-color:var(--primary)" onclick="shuffleExamQuestions()"><span data-icon="shuffle" data-icon-size="16" style="vertical-align:-3px"></span> 随机刷题</span>
        </div>
        <div id="ecQuestionArea">
          <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
            <span class="tag tag-warning" id="ecType">图形推理</span>
            <span class="tag tag-primary" id="ecSub">位置类</span>
            <span class="tag" id="ecDiff" style="background:#FFF3E0;color:#E65100">难度：中等</span>
          </div>
          <div style="font-size:var(--xt-font-md);line-height:1.8;margin-bottom:20px;color:var(--text)" id="ecQuestionText"></div>
          <div id="ecOptions" style="display:flex;flex-direction:column;gap:10px"></div>
        </div>
        <div id="ecExplanation" style="display:none;margin-top:20px">
          <div id="ecResult" style="padding:14px 16px;border-radius:12px;margin-bottom:12px;font-weight:600"></div>
          <div style="padding:16px;background:var(--bg);border-radius:12px;margin-bottom:12px">
            <div style="font-weight:700;margin-bottom:8px"><span data-icon="book-open" data-icon-size="16" style="vertical-align:-3px"></span> 解析</div>

  <!-- ==================== AI学习助手（悬浮聊天窗口） ====================
       说明：
       1. 默认“本地演示模式”：不联网、不调API、无密钥，由内置规则引擎回复；

      <div class="ai-close" onclick="toggleAiPanel()" title="收起面板"><span class="nav-icon" data-icon="close" data-icon-size="16"></span></div>
    </div>
    <div class="ai-messages" id="aiMessages"></div>
    <div class="ai-input-row">

      <div class="ai-send-btn" id="aiSendBtn" onclick="sendAiMsg()"><span data-icon="arrow-right" data-icon-size="18"></span></div>

<script>
/* 【2026-09-15】下拉列表与筛选状态同步：
   app.js 的 filterExamType 原来靠切换 .type-filter 标签的 active 高亮（标签已改下拉，那段循环变成空操作，无害）；
   这里包一层，让任何代码路径调 filterExamType(type) 时下拉框选项跟着走。DOMContentLoaded 保证在 defer 的 app.js 之后执行。 */
window.addEventListener('DOMContentLoaded', function () {
  var orig = window.filterExamType;
  if (typeof orig !== 'function') return;
  window.filterExamType = function (type) {
    var sel = document.getElementById('ecTypeSelect');
    if (sel) sel.value = type;
    orig(type);
  };
});
</script>
