      <!-- 底部功能栏：谁可以看 / 提醒谁看 / 所在位置（+ 视频 / 链接卡片）。R91-E：删「位置」按钮（与「所在位置」重复），保留 #xtmAtBtn -->

        <span class="xtm-fn" id="xtmMentionBtn" role="button" tabindex="0"><span class="nav-icon" data-icon="megaphone" data-icon-size="14"></span> 提醒谁看</span>

  <!-- 添加倒计时弹窗（全站共用 DOM，供 assets/app.js 顶层绑定使用，缺失会导致脚本中断） -->
  <div class="modal-overlay" id="countdownModal">
    <div class="modal">
      <div class="modal-title" id="countdownModalTitle">添加倒计时</div>
      <div class="form-group">
        <div class="form-label">名称</div>
        <input type="text" class="form-input" id="cdName" placeholder="如：四级考试、秋招截止">
      </div>
      <div class="form-group">
        <div class="form-label">日期</div>
        <input type="date" class="form-input" id="cdDate">
      </div>
      <div class="form-group">
        <div class="form-label">颜色</div>
        <div class="color-picker" id="cdColorPicker">
          <div class="color-dot active" style="background:#5B8DEF" data-color="#5B8DEF"></div>
          <div class="color-dot" style="background:#E05040" data-color="#E05040"></div>
          <div class="color-dot" style="background:#9B6BD9" data-color="#9B6BD9"></div>
          <div class="color-dot" style="background:#D4A056" data-color="#D4A056"></div>
          <div class="color-dot" style="background:#36CFC9" data-color="#36CFC9"></div>
          <div class="color-dot" style="background:#FF9F68" data-color="#FF9F68"></div>
        </div>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--xt-font-base);color:var(--text-secondary)">
          <input type="checkbox" id="cdPinned"> 置顶显示
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeCountdownModal()">取消</button>
        <button class="btn btn-primary" onclick="saveCountdown()">保存</button>
      </div>
    </div>
