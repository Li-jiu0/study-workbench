/* ===== 时政热点页专用样式（复用 common.css 变量，不新增色板、不引入新库） ===== */
.hn-tabs { display: flex; gap: 8px; padding: 14px 24px 0; }
.hn-tab { display: flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--text-secondary); background: var(--card); border: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
.hn-tab:hover { color: var(--primary); border-color: var(--primary); }
.hn-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.hn-body { padding: 14px 24px 32px; }

/* 顶部工具条：搜索 + 刷新（页面内，非弹窗） */
.hn-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.hn-search { flex: 1; min-width: 200px; }
.hn-refresh { display: inline-flex; align-items: center; gap: 6px; }

/* 筛选行 */
.hn-filters { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 12px; background: var(--bg); }
.hn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.hn-row:last-child { margin-bottom: 0; }
.hn-lab { font-size: 13px; color: var(--text-secondary); flex-shrink: 0; width: 32px; }
.hn-chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.hn-chip { padding: 4px 12px; border-radius: 20px; font-size: 13px; border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; white-space: nowrap; background: var(--card); transition: var(--transition); }
.hn-chip:hover { border-color: var(--primary); color: var(--primary); }
.hn-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.hn-count { font-size: 13px; color: var(--text-muted); white-space: nowrap; }

/* 列表 */
.hn-list { display: flex; flex-direction: column; gap: 8px; }
.hn-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); transition: var(--transition); }
.hn-item:hover { box-shadow: var(--shadow-hover); border-color: var(--primary); }
.hn-rank { width: 24px; height: 24px; border-radius: 6px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.hn-rank.top1 { background: #FF4D4F; color: #fff; }
.hn-rank.top2 { background: #FA8C16; color: #fff; }
.hn-rank.top3 { background: #FADB14; color: #333; }
.hn-main { flex: 1; min-width: 0; }
.hn-title { font-size: 15px; line-height: 1.6; color: var(--text); cursor: pointer; word-break: break-word; }
.hn-title:hover { color: var(--primary); }
.hn-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.hn-time { font-size: 12px; color: var(--text-muted); }
.hn-ops { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
.hn-mini { font-size: 12px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; background: transparent; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; transition: var(--transition); }
.hn-mini:hover { border-color: var(--primary); color: var(--primary); }
.hn-mini.on { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

/* 收藏 */
.hn-favbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.hn-fav { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); margin-bottom: 8px; }
.hn-fav:hover { box-shadow: var(--shadow-hover); }

/* 详情（页面内二级区域） */
.hn-dhead { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.hn-back { display: inline-flex; align-items: center; cursor: pointer; color: var(--text-secondary); white-space: nowrap; }
.hn-back:hover { color: var(--primary); }
.hn-dtitle { font-size: 16px; font-weight: 700; color: var(--text); flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.hn-dwrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
.hn-dmain { flex: 1 1 auto; min-width: 0; }
.hn-dside { flex: 0 0 280px; display: flex; flex-direction: column; gap: 10px; }
.hn-dtags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.hn-dh2 { font-size: 19px; line-height: 1.6; font-weight: 700; color: var(--text); margin: 0 0 6px; word-break: break-word; }
.hn-dsec { margin-top: 14px; }
.hn-dsub { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.hn-dol { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.9; color: var(--text); }
.hn-dol li { margin-bottom: 4px; }
.hn-box { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; line-height: 1.7; color: var(--text-secondary); background: var(--bg); }
.hn-box b { color: var(--text); }
.hn-rellist { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.hn-rel { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; font-size: 14px; line-height: 1.6; cursor: pointer; border-bottom: 1px solid var(--border); background: var(--card); }
.hn-rel:last-child { border-bottom: none; }
.hn-rel:hover { background: var(--primary-light); }
.hn-rel-rk { flex-shrink: 0; width: 18px; height: 18px; border-radius: 5px; background: var(--primary-light); color: var(--primary); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 3px; }
.hn-rel-t { flex: 1; min-width: 0; word-break: break-word; }
.hn-dacts { display: flex; gap: 8px; flex-direction: column; }

/* 底部来源条 */
.hn-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); }
.hn-src { flex: 1; min-width: 0; }
.hn-daily { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.hn-switch { background: none; border: 1px solid var(--border); color: var(--text-secondary); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.hn-switch:hover { border-color: var(--primary); color: var(--primary); }

/* 空态 / 加载 */
.hn-empty { text-align: center; padding: 46px 16px; color: var(--text-muted); }
.hn-ei { margin-bottom: 12px; opacity: .45; }
.hn-et { font-size: 15px; color: var(--text); font-weight: 600; margin-bottom: 6px; }
.hn-ed { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 12px; }
.hn-loading { text-align: center; padding: 40px 16px; color: var(--text-secondary); }
.hn-spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: hn-spin .8s linear infinite; margin-bottom: 12px; }
@keyframes hn-spin { to { transform: rotate(360deg); } }

/* ADR-3 允许的唯一轻弹层：删除二次确认 */
.hn-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.45); z-index: 1500; align-items: center; justify-content: center; }
.hn-overlay.on { display: flex; }
.hn-confirm { background: var(--card); border-radius: var(--radius); padding: 22px; width: 90%; max-width: 380px; box-shadow: var(--shadow-hover); }
.hn-confirm-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
.hn-confirm-msg { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 18px; }
.hn-confirm-actions { display: flex; gap: 10px; }
.hn-confirm-actions .btn { flex: 1; }

@media (max-width: 900px) {
  .hn-dwrap { flex-direction: column; }
  .hn-dside { flex: 1 1 auto; width: 100%; }
  .hn-body, .hn-tabs { padding-left: 12px; padding-right: 12px; }
  .hn-item { flex-wrap: wrap; }
  .hn-ops { width: 100%; }
}
/* ===== R73 需求20-B 移动端适配（≤768px）=====
   仅作用于窄屏；桌面端(>768px)渲染零影响（本块整体位于媒体查询内）。
   1) 内嵌媒体兜底 max-width，防 JS 注入内容/未来素材撑破窄屏；
   2) 宽表格窄屏内横向滚动，避免整页横向溢出（需求20-B #2）；
   3) 字号下限兜底：common.css 的 .bn-label(10px)/.ai-mode-badge(9px)/
      .study-stats-bar b(9px) 低于 A7 辅助≥11px，页内窄屏提升到 11px（不改共享 common.css）。 */
@media (max-width: 768px) {
  img, video, canvas, iframe { max-width: 100%; height: auto; }
  table { display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .bottom-nav-item .bn-label, .ai-mode-badge, .study-stats-bar b { font-size: 11px; }
  /* 芯片行独占整行，计数折到次行，消除 320px 下 .hn-chip 与 .hn-count 交叠（#4 定点收敛） */
  .hn-bar { gap: 6px; }
  .hn-chips { flex: 1 1 100%; }
  .hn-chip { white-space: normal; }
}
</style>

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
