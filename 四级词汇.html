<script>
// P1 修复（0913i）：词库增量分片合并完成（app.js 派发 'vocab-merged'）后，
// 按当前模式重建 vocabModeList（新词/复习过滤基于合并后的 CET_VOCAB）并重渲染，
// 使「共 N」与词卡列表实时反映合并后的词库；当前索引收拢到合法范围。
// 注意：本内联脚本先于 defer 的 app.js 执行，但回调仅在事件触发时运行，届时函数均已就绪。
(function () {
  window.addEventListener('vocab-merged', function (e) {
    var added = (e && e.detail && e.detail.added) || 0;
    if (!added) return;
    if (typeof getNewVocabs !== 'function' || typeof renderVocab !== 'function') return;
    try {
      vocabModeList = (vocabMode === 'review') ? getReviewVocabs() : getNewVocabs();
      if (vocabCurrentIndex >= vocabModeList.length) vocabCurrentIndex = 0;
      if (vocabModeList.length > 0) renderVocab();
    } catch (err) { /* 静默：用户下次切换模式时自然刷新 */ }
  });
})();
</script>
