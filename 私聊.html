<style>

  /* ===== 私信页（嵌在应用外壳内）===== */
  .im-side{width:300px;min-width:240px;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column}
  .im-head{padding:14px 14px 8px;border-bottom:1px solid var(--border)}
  .im-title{font-size:16px;font-weight:700;margin:0 0 8px}
  .im-search{display:flex;gap:6px;margin-bottom:8px}
  .im-search input{flex:1;min-width:0}
  .im-tabs{display:flex;gap:6px}
  .im-tab{flex:1;text-align:center;padding:6px 0;font-size:13px;border:1px solid var(--border);background:var(--bg);color:var(--text-secondary);border-radius:8px;cursor:pointer}
  .im-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .im-list{flex:1;overflow-y:auto}
  .im-sess{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
  .im-sess.on{background:var(--primary-light)}
  .im-av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary-light),#e9ecff);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--primary);overflow:hidden;flex-shrink:0}
  .im-av img{width:100%;height:100%;object-fit:cover}
  .im-si{flex:1;min-width:0}
  .im-n{font-size:14px;font-weight:600}
  .im-sub{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .im-badge{background:#ff5d5d;color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px;flex-shrink:0}
  .im-del{color:var(--danger);font-size:12px;cursor:pointer}
  .im-chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .im-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:14px}
  .im-conv{flex:1;display:flex;flex-direction:column;min-height:0}
  .im-chat-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--card)}
  .im-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .im-m{max-width:72%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
  .im-m.me{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-bottom-right-radius:4px}
  .im-m.ot{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
  .im-mt{font-size:10px;opacity:.75;margin-top:4px;text-align:right}
  .im-m.ot .im-mt{color:var(--text-secondary)}
  /* 2026-09-15 批次八：消息撤回 —— 入口按钮 / 轻量确认气泡 / 已撤回系统提示 */
  .im-m{position:relative}
  .im-recall-btn{position:absolute;top:50%;left:-46px;transform:translateY(-50%);width:40px;height:22px;line-height:20px;text-align:center;font-size:11px;color:var(--text-secondary);background:var(--card);border:1px solid var(--border);border-radius:6px;cursor:pointer;user-select:none;white-space:nowrap;box-sizing:border-box;opacity:0;transition:opacity .15s}
  .im-m:hover .im-recall-btn{opacity:1}
  .im-recall-btn:hover{color:#fff;background:#ff5d5d;border-color:#ff5d5d}
  .im-recall-tip{align-self:center;max-width:80%;padding:4px 10px;font-size:12px;color:var(--text-secondary);background:var(--bg);border-radius:10px;text-align:center}
  .im-recall-confirm{position:fixed;z-index:10000;min-width:190px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
  .im-rc-txt{font-size:13px;color:var(--text);margin-bottom:10px}
  .im-rc-btns{display:flex;justify-content:flex-end;gap:8px}
  .im-rc-btns button{border:0;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  .im-rc-cancel{background:var(--bg);color:var(--text-secondary);border:1px solid var(--border)}
  .im-rc-ok{background:#ff5d5d;color:#fff}
  @media (max-width:760px){
    .im-recall-btn{position:static;display:inline-block;margin-top:4px;transform:none;opacity:.6}
  }
  .im-empty2{text-align:center;padding:36px 16px;color:var(--text-secondary);font-size:13px}
  .im-composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;background:var(--card);border-top:1px solid var(--border)}
  .im-composer textarea{flex:1;resize:none;height:44px;max-height:120px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;font-size:14px;outline:none;font-family:inherit;background:var(--bg);color:var(--text)}
  .im-composer textarea:focus{border-color:var(--primary)}
  .im-icon{width:44px;height:44px;border:none;border-radius:12px;background:var(--primary-light);color:var(--primary);font-size:18px;cursor:pointer;flex-shrink:0}
  .im-send{height:44px;padding:0 18px;border:none;border-radius:12px;background:linear-gradient(90deg,var(--primary),var(--accent));color:#fff;cursor:pointer;flex-shrink:0}
  @media (max-width:760px){
    .im-side{width:100%;border-right:none}
    .im-chat{display:none}
    body.im-mobile .im-side{display:none}
    body.im-mobile .im-chat{display:flex}
  }
  /* 2026-09-15 批次八（ADR-3）：群设置 / 联系管理员 —— 遮罩弹窗改为右侧会话区「页面内视图」。
     两个节点搬进 #imChat，与 #imEmpty / #imConv 平级互斥占满右栏；无遮罩、无浮层、无 z-index。 */
  .im-gs-view,.im-ac-view{flex:1;min-width:0;min-height:0;display:none;flex-direction:column;overflow:hidden;background:var(--bg)}
  .im-gs-view .im-gs-head{background:var(--card);padding:10px 16px}
  .im-gs-view .im-gs-body{background:transparent}

</style>
</head>

<div class="page active" id="page-im" style="display:flex;overflow:hidden">
      <aside class="im-side">

          <div class="im-search">
            <input id="imSearch" class="form-input" placeholder="搜用户名/昵称找人…">
            <button class="btn btn-outline" onclick="imDoSearch()" style="white-space:nowrap"><span class="nav-icon" data-icon="search" data-icon-size="16"></span></button>
          </div>
          <div class="im-tabs">
            <!-- C1 20260913k：五 tab 顺序不变（会话→好友→群聊→申请→加好友）；「群聊」「加好友」由弹窗改为 tab 页面视图（onclick 改 imSwitchTab，原弹窗函数保留供面板复用） -->
            <button class="im-tab active" data-tab="chats" onclick="imSwitchTab('chats')">💬 会话</button>
            <button class="im-tab" data-tab="friends" onclick="imSwitchTab('friends')">👥 好友</button>
            <button class="im-tab" data-tab="groups" onclick="imSwitchTab('groups')" title="我的群聊 · 发起新群聊">👥 群聊</button>
            <!-- 【后续扩展点】发起群聊（T4 增量）：多选好友建群，本地模式提示「群聊需要联网」 -->
            <button class="im-tab" data-tab="requests" onclick="imSwitchTab('requests')">📩 申请</button>
            <button class="im-tab im-tab-add" data-tab="addfriend" onclick="imSwitchTab('addfriend')" title="搜索用户名/昵称添加好友">加好友</button>
          </div>
        </div>
        <!-- 需求01：联系管理员固定入口（管理员对普通用户完全隐形，这是唯一联系途径）。
             点击后由 assets/admin-contact.js 直接走 /api/chat/* 开会话，绕开好友前置。
             R45（20260914e）：视觉改为与好友会话行（.im-sess）同款 —— 圆形盾牌头像 + 昵称 + 最近一条消息/时间，
             固定为会话列表首行。节点刻意留在 #imList 之外独立渲染：admin-contact.js 只改写文本节点与角标，
             不参与 chat-local.js renderChats() 的整表 innerHTML 重建，因此不会随 5s 未读轮询闪烁。 -->
        <div class="ac-entry im-sess" id="acEntry" onclick="xtOpenAdminChat()" title="联系管理员（管理员不参与好友列表）">
          <div class="im-av ac-av"><span class="nav-icon" data-icon="shield" data-icon-size="18"></span></div>
          <div class="im-si"><div class="im-n">管理员</div><div class="im-sub" id="acEntrySub">管理员在线时会回复你</div></div>
          <span class="ac-badge" id="acEntryBadge" style="display:none"></span>
        </div>
        <!-- C1 20260913k：「群聊」「加好友」tab 面板宿主（原弹窗节点由页尾脚本整体搬入，id 不变，chat-local.js 弹窗函数照常按 id 命中） -->
        <div class="im-panel-host" id="imPanelGroups"></div>
        <div class="im-panel-host" id="imPanelAddFriend"></div>
        <div class="im-list" id="imList"></div>
      </aside>
      <section class="im-chat" id="imChat">
        <div class="im-empty" id="imEmpty">👈 选择左侧好友开始私聊</div>
        <div class="im-conv" id="imConv" style="display:none">
          <div class="im-chat-head">
            <button class="im-icon" id="imBack" onclick="imBackList()" style="display:none" title="返回会话列表">←</button>
            <div class="im-av" id="imCAv"></div>
            <div style="flex:1;font-weight:700" id="imCName"></div>
            <!-- T02 增量 2026-09-11：群会话「⋯」群设置入口（仅群会话由 renderChatHeader() 显示，私聊会话用 display 隐藏而非删 DOM） -->
            <button class="im-icon" id="imGSBtn" onclick="imOpenGroupSettings()" title="群设置" style="display:none">⋯</button>
          </div>
          <div class="im-msgs" id="imMsgs"></div>
          <!-- R55（2026-09-14）：帖子分享接收侧转发卡片预览容器（默认隐藏，由页尾脚本按 localStorage 渲染） -->
          <div id="imForwardCard" class="im-forward-card" style="display:none"></div>
          <div class="im-composer">
            <textarea id="imInput" placeholder="输入消息…"></textarea>
            <!-- 【后续扩展点】表情面板（T4 增量）：[emoji:xx] 文本语法，Unicode 渲染，离线可用 -->
            <button class="im-icon" title="表情" onclick="imToggleEmoji()"><span class="nav-icon" data-icon="smile" data-icon-size="20"></span></button>
            <div class="im-emoji-panel" id="imEmojiPanel" style="display:none"></div>
            <!-- R51（2026-09-14）：发图按钮 + 隐藏 file input 恢复（图片消息正式支持）。
                 点击 → imPickImage() → 触发 #imImgInput → change → imSendImage(this)
                 → chat-local.js：在线 POST /api/uploads/image + 发 kind='image' 消息；离线回落 dataURL。 -->
            <button class="im-icon" title="发送图片" onclick="imPickImage()"><span class="nav-icon" data-icon="image" data-icon-size="20"></span></button>
            <input type="file" id="imImgInput" accept="image/*" style="display:none" onchange="imSendImage(this)">
            <button class="im-send" onclick="imSendText()">发送</button>
          </div>
        </div>

        <!-- ==================== 群设置（页面内视图 · ADR-3 2026-09-15 批次八） ====================
             原 .im-overlay / .im-modal 遮罩外壳已移除，本节点作为右侧会话区的一个「视图」与
             #imEmpty / #imConv 平级互斥显示：点会话头「⋯」切进来，返回箭头 / ✕ / Esc 切回会话。
             id（#imGroupSettingsModal、#imGsBody）与内部控件 id 全部保留，
             内容仍由 chat-local.js 的 imRenderGroupSettings() 渲染到 #imGsBody，成员管理 / 踢人 /
             免打扰 / 群内昵称 / 退群解散 / 改群名公告 一个不删。 -->
        <div class="im-gs-view" id="imGroupSettingsModal" style="display:none">
          <div class="im-modal-head im-gs-head">
            <button class="im-icon" onclick="imCloseGroupSettings()" title="返回会话">←</button>
            <div style="flex:1;font-size:var(--xt-font-md);font-weight:700">群设置</div>
            <div style="cursor:pointer;color:#999;font-size:var(--xt-font-2xl)" onclick="imCloseGroupSettings()" title="返回会话">✕</div>
          </div>
          <div class="im-gs-body" id="imGsBody">
            <div class="im-empty2" style="padding:20px 0;text-align:center;color:#999;font-size:var(--xt-font-base)">加载中…</div>
          </div>
        </div>

        <!-- 需求01：联系管理员会话（页面内视图 · ADR-3 2026-09-15 批次八）
             原 .ac-overlay 遮罩与 .ac-panel 浮层外壳已移除，消息列表 #acMsgs + 输入框 #acInput 完整保留，
             显隐仍由 admin-contact.js 的 xtOpenAdminChat() / acClose() 按 #acPanel 的 display 控制。 -->
        <div class="im-ac-view" id="acPanel" style="display:none">
          <div class="ac-head">
            <div class="ac-avatar">🛡️</div>
            <div style="flex:1;min-width:0">
              <div class="ac-title">联系管理员</div>
              <div class="ac-hint">管理员在线时会回复你</div>
            </div>
            <button class="ac-close" onclick="acClose()" title="返回" aria-label="返回">✕</button>
          </div>
          <div class="ac-msgs" id="acMsgs"></div>
          <div class="ac-composer">
            <textarea id="acInput" rows="1" placeholder="输入消息…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();acSend()}"></textarea>
            <button class="ac-send" onclick="acSend()">发送</button>
          </div>
        </div>
      </section>
    </div>
  </div>

<script>
/* 本页顶栏搜索框专用：只搜索聊天记录（好友昵称 + 本地/服务器消息内容），不搜发贴模块 */
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtTime(t) {
    if (!t) return '';
    var d = new Date(t);
    if (isNaN(d)) return '';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function apiBase() { return (window.STUDY_API_BASE != null ? window.STUDY_API_BASE : ((location.protocol === 'http:' || location.protocol === 'https:') ? '' : 'http://110.42.134.62:8000')); }
  function tok() { return localStorage.getItem('study_workbench_token') || ''; }

  function render(kw, hits) {
    var dd = document.getElementById('gsDropdown'); if (!dd) return;
    if (!hits.length) { dd.innerHTML = '<div class="gs-empty">聊天记录里没有找到「' + esc(kw) + '」</div>'; }
    else {
      dd.innerHTML = hits.slice(0, 12).map(function (h) {
        return '<div class="gs-item" onclick="window.__gsOpen(' + h.fid + ');closeGsDropdown && closeGsDropdown()">' +
          '<div class="gs-item-icon"><span class="nav-icon" data-icon="message-circle" data-icon-size="18"></span></div><div class="gs-item-main">' +
          '<div class="gs-item-title">' + esc(h.name) + '</div>' +
          '<div class="gs-item-desc">' + esc(h.txt) + ' · ' + fmtTime(h.time) + '</div></div></div>';
      }).join('') + (hits.length > 12 ? '<div class="gs-empty">还有 ' + (hits.length - 12) + ' 条结果未显示</div>' : '');
    }
    dd.classList.add('open');
    /* C1 20260913k：动态插入的 data-icon span 需手动触发一次图标水合 */
    if (window.lucideAutoRender) window.lucideAutoRender();
  }
  window.__gsOpen = function (fid) { if (typeof imOpenChat === 'function') imOpenChat(fid); };

  window.globalSearch = function (kw) {
    var dd = document.getElementById('gsDropdown'); if (!dd) return;
    kw = (kw || '').trim();
    if (!kw) { dd.classList.remove('open'); dd.innerHTML = ''; return; }
    var kwL = kw.toLowerCase();
    var hits = [], seen = {};
    var data = null;
    try { data = JSON.parse(localStorage.getItem('study_im_local_data') || 'null'); } catch (e) { }
    if (data && data.chats) {
      Object.keys(data.chats).forEach(function (fid) {
        var c = data.chats[fid];
        var nameHit = (c.nickname || '').toLowerCase().indexOf(kwL) >= 0;
        var got = false;
        ((data.messages || {})[fid] || []).forEach(function (m) {
          if ((m.content || '').toLowerCase().indexOf(kwL) >= 0) {
            hits.push({ fid: Number(fid), name: c.nickname || '好友', txt: m.content, time: m.time }); got = true;
          }
        });
        if (nameHit && !got) hits.push({ fid: Number(fid), name: c.nickname || '好友', txt: '（联系人，点开查看聊天）', time: c.time || '' });
        seen[fid] = 1;
      });
    }
    render(kw, hits);

    /* 服务器好友：异步补充搜索服务器聊天记录 */
    var t = tok(); if (!t) return;
    var servers = [];
    if (data && data.chats) Object.keys(data.chats).forEach(function (fid) { if (Number(fid) >= 10000) servers.push({ fid: Number(fid), sid: Number(fid) - 10000, name: data.chats[fid].nickname }); });
    // 本地缓存里还没有的服务器好友（刚加载的情况）也从会话列表补
    if (typeof S !== 'undefined' && S && S.chats) S.chats.forEach(function (c) { if (c.isServer && c.serverId && servers.indexOf ) { var fid = 10000 + c.serverId; if (!seen[fid] && !servers.some(function (s) { return s.fid === fid; })) servers.push({ fid: fid, sid: c.serverId, name: c.nickname }); } });
    if (!servers.length) return;
    var serverHits = [], pending = servers.length;
    servers.forEach(function (sv) {
      fetch(apiBase() + '/api/chat/' + sv.sid + '/messages?limit=50', { headers: { 'Authorization': 'Bearer ' + t } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var nameHit = (sv.name || '').toLowerCase().indexOf(kwL) >= 0, got = false;
          (d.items || []).forEach(function (m) {
            if ((m.content || '').toLowerCase().indexOf(kwL) >= 0) {
              serverHits.push({ fid: sv.fid, name: sv.name, txt: m.content, time: m.createdAt }); got = true;
            }
          });
          if (nameHit && !got) serverHits.push({ fid: sv.fid, name: sv.name, txt: '（联系人，点开查看聊天）', time: '' });
        })
        .catch(function () { })
        .finally(function () { if (--pending === 0) { Array.prototype.push.apply(hits, serverHits); render(kw, hits); } });
    });
  };
})();
</script>
<script>
/* C1 20260913k：「加好友」「群聊」入口由弹窗改为 tab 页面视图。
   实现方式：
   1. 把 #imGroupModal / #imAddFriendModal 整体节点搬进侧栏面板宿主（DOM 位置变化、id 不变），
      chat-local.js 的弹窗函数（imOpenGroupCreator / imOpenAddFriendModal 等）原样保留并复用——
      其内部均按 id / querySelector 查找，搬家后依然命中，入口不再弹浮层；
   2. 包装 imSwitchTab：groups / addfriend 两个 tab 走面板视图（隐藏 #imList、显示面板宿主、
      复用原弹窗函数填充内容），其余 tab 走原逻辑并恢复列表；
   3. 包装关闭函数：面板内 Esc / ✕ 关闭后自动回到「会话」tab，避免侧栏挂空面板。 */
(function () {
  'use strict';

  var activePanel = null; // 当前面板 tab：null | 'groups' | 'addfriend'

  function $id(x) { return document.getElementById(x); }

  /* 1. 搬家：模态节点移入侧栏面板宿主（幂等，只搬一次）
        R56（2026-09-14）：imGroupModal 不再搬家 —— 「群聊」tab 改为承载「我的群聊」列表
        （chat-local.js renderGroupsTab），建群弹层恢复为独立的 .im-overlay 浮层，
        由列表顶部「+ 发起群聊」按钮触发 imOpenGroupCreator()。 */
  function relocateModals() {
    [['imAddFriendModal', 'imPanelAddFriend']].forEach(function (p) {
      var modal = $id(p[0]), host = $id(p[1]);
      if (modal && host && modal.parentElement !== host) host.appendChild(modal);
    });
  }

  /* 2. 面板显隐：进入面板 tab 时隐藏会话列表并复用原弹窗函数填充内容 */
  function showPanel(tab) {
    var modalId = tab === 'groups' ? 'imGroupModal' : 'imAddFriendModal';
    if (tab === 'groups' && typeof window.imOpenGroupCreator === 'function') window.imOpenGroupCreator();
    else if (tab === 'addfriend' && typeof window.imOpenAddFriendModal === 'function') window.imOpenAddFriendModal();
    var modal = $id(modalId);
    if (!modal || modal.style.display === 'none') {
      // 原函数因未登录等条件只 toast 未开面板 → 回退会话 tab，侧栏不留空白
      window.imSwitchTab('chats');
      return;
    }
    var list = $id('imList');
    if (list) list.style.display = 'none';
    ['imPanelGroups', 'imPanelAddFriend'].forEach(function (hid) {
      var h = $id(hid);
      if (h) h.classList.toggle('active', hid === (tab === 'groups' ? 'imPanelGroups' : 'imPanelAddFriend'));
    });
    activePanel = tab;
  }

  function hidePanels() {
    var list = $id('imList');
    if (list) list.style.display = '';
    ['imPanelGroups', 'imPanelAddFriend'].forEach(function (hid) {
      var h = $id(hid);
      if (h) h.classList.remove('active');
    });
    activePanel = null;
  }

  /* 3. 包装 imSwitchTab（须在 chat-local.js 加载后执行） */
  function patchSwitchTab() {
    if (typeof window.imSwitchTab !== 'function' || window.__imSwitchTabPatched) return;
    var real = window.imSwitchTab;
    window.imSwitchTab = function (tab) {
      /* R56（2026-09-14）：'groups' 不再是「面板 tab」——它现在承载「我的群聊」列表
         （chat-local.js renderGroupsTab 渲染到 #imList），建群弹层改为列表内按钮触发的浮层。
         只有 'addfriend' 仍走面板视图。 */
      if (tab === 'addfriend') {
        real(tab);        // 复用原逻辑：tab 高亮切换 + 列表占位渲染（渲染结果被面板覆盖）
        showPanel(tab);
        return;
      }
      hidePanels();
      real(tab);
    };
    window.__imSwitchTabPatched = true;
  }

  /* 4. 包装关闭函数：面板处于激活态时关闭后回到会话 tab */
  function patchClosers() {
    [['imCloseGroupCreator'], ['imCloseAddFriendModal']].forEach(function (p) {
      var name = p[0], fn = window[name];
      if (typeof fn !== 'function' || fn.__imPanelPatched) return;
      var wrapped = function () {
        fn();
        if (activePanel) window.imSwitchTab('chats');
      };
      wrapped.__imPanelPatched = true;
      window[name] = wrapped;
    });
  }

  function init() {
    relocateModals();
    patchSwitchTab();
    patchClosers();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<script>
/* R55（2026-09-14）：帖子分享「接收侧」—— 读 study_workbench_share_forward_v1 渲染转发卡片。
   数据由广场帖子分享（线4）写入 localStorage；本页只在打开时读一次并渲染预览。
   发送时由 chat-local.js 的 imSendText 调 window.__imConsumeForward() 取出深链拼到正文；
   取消即移除。键缺失 / JSON 非法 / id 为空 → 不渲染、不抛错（零侵入）。
   2026-09-14 修：兼容发送侧的 excerpt 摘要字段与字符串 id（原 Number(id) 会把 'n_001' 判为无效）。 */
(function () {
  'use strict';
  var KEY = 'study_workbench_share_forward_v1';
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /* 发送侧（学习博客.html R55）实际写入契约（只读核对，不改发送侧）：
       {v:1, type:'note', id:String, title:String, excerpt:String, cover:String, url:'…#note=<id>', ts:Number}
     两条兼容要点（2026-09-14 修）：
       1) 摘要字段是 **excerpt**，不是 summary → 两者都兼容（优先 summary，兼容历史/他处写法）；
       2) id 可能是字符串（本地笔记形如 'n_001'）或数字串（在线）→ **只校验非空**，不做 Number 强转，
          否则字符串 id 会被 Number() 变成 NaN 判为无效，卡片直接不渲染。 */
  function parsePayload() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var p = JSON.parse(raw);
      if (!p || typeof p !== 'object') return null;
      var rawId = (p.id != null && p.id !== '') ? p.id : (p.noteId != null ? p.noteId : '');
      var id = String(rawId == null ? '' : rawId).trim();
      if (!id) return null;
      var url = (typeof p.url === 'string' && p.url) ? p.url.trim() : '';
      return {
        id: id,
        url: url,
        title: String(p.title || p.name || '帖子').slice(0, 60),
        summary: String(p.summary || p.excerpt || '').slice(0, 80)
      };
    } catch (e) { return null; }
  }
  function render() {
    var host = document.getElementById('imForwardCard');
    if (!host) return;
    var p = parsePayload();
    if (!p) { host.style.display = 'none'; host.innerHTML = ''; return; }
    host.innerHTML =
      '<div class="im-forward-tag">🔗 转发自帖子</div>' +
      '<div class="im-forward-body"><div style="flex:1;min-width:0">' +
        '<div class="im-forward-title">' + esc(p.title) + '</div>' +
        (p.summary ? '<div class="im-forward-sum">' + esc(p.summary) + '</div>' : '') +
      '</div><div class="im-forward-cancel" onclick="window.__imClearForwardCard()">取消</div></div>';
    host.style.display = 'block';
  }
  window.__imClearForwardCard = function () {
    try { localStorage.removeItem(KEY); } catch (e) { }
    var host = document.getElementById('imForwardCard');
    if (host) { host.style.display = 'none'; host.innerHTML = ''; }
  };
  window.__imConsumeForward = function () {
    var p = parsePayload();
    if (!p) return '';
    window.__imClearForwardCard();
    // 优先用发送侧已拼好的深链 url（自带 #note=<id>）；只有 id 的旧数据再自行拼，不再重新拼 url
    return p.url || ('#note=' + p.id);
  };
  window.__imRenderForwardCard = render;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
  else render();
})();
</script>
<script>
/* =====================================================================
   2026-09-15 批次八（ADR-3）：群设置 / 联系管理员 —— 遮罩弹窗 → 右栏「页面内视图」
   ---------------------------------------------------------------------
   #imGroupSettingsModal 与 #acPanel 已搬进 #imChat，与 #imEmpty / #imConv 平级。
   本脚本只做「视图互斥切换」的包装：原函数（imOpenGroupSettings / imCloseGroupSettings /
   xtOpenAdminChat / acClose）函数名与内部逻辑全部保留，仅在打开后隐藏会话、关闭后还原会话。
   id 与内部控件 id 一个未动，chat-local.js / admin-contact.js 按 id 照常命中，无死链。
   ===================================================================== */
(function () {
  'use strict';

  var BASE = ['imEmpty', 'imConv'];  // 右栏基础视图（空态 / 会话）
  var cur = null;    // 当前激活视图 id（null = 基础视图在显示）
  var saved = null;  // 进入视图前的基础视图 display 快照

  function $id(x) { return document.getElementById(x); }

  function hideBase() {
    saved = { mobile: document.body.classList.contains('im-mobile') };
    BASE.forEach(function (id) {
      var el = $id(id);
      saved[id] = el ? el.style.display : '';
      if (el) el.style.display = 'none';
    });
  }

  function restoreBase() {
    if (!saved) return;
    BASE.forEach(function (id) {
      var el = $id(id);
      if (el) el.style.display = saved[id];
    });
    if (saved.mobile) document.body.classList.add('im-mobile');
    else document.body.classList.remove('im-mobile');
    saved = null;
  }

  function showView(id) {
    if (cur === id) return;
    if (cur) { var prev = $id(cur); if (prev) prev.style.display = 'none'; }
    else hideBase();
    cur = id;
    var v = $id(id);
    if (v) v.style.display = 'flex';
    /* 窄屏右栏默认隐藏（.im-chat{display:none}），切视图时确保可见 */
    document.body.classList.add('im-mobile');
  }

  function hideView(id) {
    var v = $id(id);
    if (v) v.style.display = 'none';
    if (cur === id) { cur = null; restoreBase(); }
  }

  /* 打开类：原函数跑完再判断是否真的打开了（失败路径只 toast 不改 display） */
  function wrapAfter(name, after) {
    if (typeof window[name] !== 'function' || window[name].__imViewPatched) return;
    var fn = window[name];
    var w = function () { var r = fn.apply(this, arguments); after(); return r; };
    w.__imViewPatched = true;
    window[name] = w;
  }

  /* 关闭类：先收起视图再让原函数走（顺序无关，统一放后面即可） */
  function wrapBefore(name, before) {
    if (typeof window[name] !== 'function' || window[name].__imViewPatched) return;
    var fn = window[name];
    var w = function () { before(); return fn.apply(this, arguments); };
    w.__imViewPatched = true;
    window[name] = w;
  }

  function init() {
    wrapAfter('imOpenGroupSettings', function () {
      var m = $id('imGroupSettingsModal');
      if (m && m.style.display !== 'none') showView('imGroupSettingsModal');
    });
    wrapAfter('imCloseGroupSettings', function () { hideView('imGroupSettingsModal'); });

    wrapAfter('xtOpenAdminChat', function () {
      var p = $id('acPanel');
      if (p && p.style.display !== 'none') showView('acPanel');
    });
    wrapAfter('acClose', function () { hideView('acPanel'); });

    /* 在视图里点左侧会话 → 先收起视图，避免两个视图同时占位 */
    wrapBefore('imOpenChat', function () { if (cur) hideView(cur); });
    wrapBefore('imBackToList', function () { if (cur) hideView(cur); });

    /* admin-contact.js 的 Esc 分支直接调内部 closePanel()（不走 window.acClose），
       这里补一刀还原基础视图；其监听器注册在前，此时面板已 display:none。 */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && cur === 'acPanel') hideView('acPanel');
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
