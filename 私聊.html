  .im-side{width:300px;min-width:240px;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column}
  .im-head{padding:14px 14px 8px;border-bottom:1px solid var(--border)}
  .im-title{font-size:16px;font-weight:700;margin:0 0 8px}
  .im-search{display:flex;gap:6px;margin-bottom:8px}
  .im-search input{flex:1;min-width:0}
  .im-tabs{display:flex;gap:6px}
  .im-tab{flex:1;text-align:center;padding:6px 0;font-size:13px;border:1px solid var(--border);background:var(--bg);color:var(--text-secondary);border-radius:8px;cursor:pointer}
  .im-tab.active{background:linear-gradient(90deg,var(--primary),var(--accent));color:#fff;border-color:transparent}
  .im-list{flex:1;overflow-y:auto}
  .im-sess{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
  .im-sess.on{background:var(--primary-light)}
  .im-av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary-light),#e9ecff);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--primary);overflow:hidden;flex-shrink:0}
  .im-av img{width:100%;height:100%;object-fit:cover}
  .im-si{flex:1;min-width:0}
  .im-n{font-size:14px;font-weight:600}
  .im-sub{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .im-badge{background:#ff5d5d;color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px;flex-shrink:0}
  .im-del{color:var(--danger);font-size:12px;cursor:pointer}
  .im-chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .im-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:14px}
  .im-conv{flex:1;display:flex;flex-direction:column;min-height:0}
  .im-chat-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--card)}
  .im-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .im-m{max-width:72%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
  .im-m.me{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-bottom-right-radius:4px}
  .im-m.ot{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
  .im-mt{font-size:10px;opacity:.75;margin-top:4px;text-align:right}
  .im-m.ot .im-mt{color:var(--text-secondary)}
  .im-empty2{text-align:center;padding:36px 16px;color:var(--text-secondary);font-size:13px}
  .im-composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;background:var(--card);border-top:1px solid var(--border)}
  .im-composer textarea{flex:1;resize:none;height:44px;max-height:120px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;font-size:14px;outline:none;font-family:inherit;background:var(--bg);color:var(--text)}
  .im-composer textarea:focus{border-color:var(--primary)}
  .im-icon{width:44px;height:44px;border:none;border-radius:12px;background:var(--primary-light);color:var(--primary);font-size:18px;cursor:pointer;flex-shrink:0}
  .im-send{height:44px;padding:0 18px;border:none;border-radius:12px;background:linear-gradient(90deg,var(--primary),var(--accent));color:#fff;cursor:pointer;flex-shrink:0}
  @media (max-width:760px){
    .im-side{width:100%;border-right:none}
    .im-chat{display:none}
    body.im-mobile .im-side{display:none}
    body.im-mobile .im-chat{display:flex}
  }

<script>
/* 本页顶栏搜索框专用：只搜索聊天记录（好友昵称 + 本地/服务器消息内容），不搜发贴模块 */
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtTime(t) {
    if (!t) return '';
    var d = new Date(t);
    if (isNaN(d)) return '';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function apiBase() { return (window.STUDY_API_BASE != null ? window.STUDY_API_BASE : ((location.protocol === 'http:' || location.protocol === 'https:') ? '' : 'http://110.42.134.62:8000')); }
  function tok() { return localStorage.getItem('study_workbench_token') || ''; }

  function render(kw, hits) {
    var dd = document.getElementById('gsDropdown'); if (!dd) return;
    if (!hits.length) { dd.innerHTML = '<div class="gs-empty">聊天记录里没有找到「' + esc(kw) + '」</div>'; }
    else {
      dd.innerHTML = hits.slice(0, 12).map(function (h) {
        return '<div class="gs-item" onclick="window.__gsOpen(' + h.fid + ');closeGsDropdown && closeGsDropdown()">' +
          '<div class="gs-item-icon">💬</div><div class="gs-item-main">' +
          '<div class="gs-item-title">' + esc(h.name) + '</div>' +
          '<div class="gs-item-desc">' + esc(h.txt) + ' · ' + fmtTime(h.time) + '</div></div></div>';
      }).join('') + (hits.length > 12 ? '<div class="gs-empty">还有 ' + (hits.length - 12) + ' 条结果未显示</div>' : '');
    }
    dd.classList.add('open');
  }
  window.__gsOpen = function (fid) { if (typeof imOpenChat === 'function') imOpenChat(fid); };

  window.globalSearch = function (kw) {
    var dd = document.getElementById('gsDropdown'); if (!dd) return;
    kw = (kw || '').trim();
    if (!kw) { dd.classList.remove('open'); dd.innerHTML = ''; return; }
    var kwL = kw.toLowerCase();
    var hits = [], seen = {};
    var data = null;
    try { data = JSON.parse(localStorage.getItem('study_im_local_data') || 'null'); } catch (e) { }
    if (data && data.chats) {
      Object.keys(data.chats).forEach(function (fid) {
        var c = data.chats[fid];
        var nameHit = (c.nickname || '').toLowerCase().indexOf(kwL) >= 0;
        var got = false;
        ((data.messages || {})[fid] || []).forEach(function (m) {
          if ((m.content || '').toLowerCase().indexOf(kwL) >= 0) {
            hits.push({ fid: Number(fid), name: c.nickname || '好友', txt: m.content, time: m.time }); got = true;
          }
        });
        if (nameHit && !got) hits.push({ fid: Number(fid), name: c.nickname || '好友', txt: '（联系人，点开查看聊天）', time: c.time || '' });
        seen[fid] = 1;
      });
    }
    render(kw, hits);

    /* 服务器好友：异步补充搜索服务器聊天记录 */
    var t = tok(); if (!t) return;
    var servers = [];
    if (data && data.chats) Object.keys(data.chats).forEach(function (fid) { if (Number(fid) >= 10000) servers.push({ fid: Number(fid), sid: Number(fid) - 10000, name: data.chats[fid].nickname }); });
    // 本地缓存里还没有的服务器好友（刚加载的情况）也从会话列表补
    if (typeof S !== 'undefined' && S && S.chats) S.chats.forEach(function (c) { if (c.isServer && c.serverId && servers.indexOf ) { var fid = 10000 + c.serverId; if (!seen[fid] && !servers.some(function (s) { return s.fid === fid; })) servers.push({ fid: fid, sid: c.serverId, name: c.nickname }); } });
    if (!servers.length) return;
    var serverHits = [], pending = servers.length;
    servers.forEach(function (sv) {
      fetch(apiBase() + '/api/chat/' + sv.sid + '/messages?limit=50', { headers: { 'Authorization': 'Bearer ' + t } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var nameHit = (sv.name || '').toLowerCase().indexOf(kwL) >= 0, got = false;
          (d.items || []).forEach(function (m) {
            if ((m.content || '').toLowerCase().indexOf(kwL) >= 0) {
              serverHits.push({ fid: sv.fid, name: sv.name, txt: m.content, time: m.createdAt }); got = true;
            }
          });
          if (nameHit && !got) serverHits.push({ fid: sv.fid, name: sv.name, txt: '（联系人，点开查看聊天）', time: '' });
        })
        .catch(function () { })
        .finally(function () { if (--pending === 0) { Array.prototype.push.apply(hits, serverHits); render(kw, hits); } });
    });
  };
})();
</script>
