<style>
  body{margin:0;background:var(--bg);font-family:inherit;min-height:100vh}
  .af-wrap{max-width:560px;margin:0 auto;padding:16px}
  .af-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .af-back{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);cursor:pointer;font-size:16px;color:var(--text)}
  .af-title{font-size:18px;font-weight:800;color:var(--text)}
  .af-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
  .af-card h3{margin:0 0 12px;font-size:15px;color:var(--text)}
  .af-search{display:flex;gap:8px}
  .af-search input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;outline:none}
  .af-search input:focus{border-color:var(--primary)}
  .af-btn{padding:10px 16px;border:none;border-radius:10px;background:linear-gradient(90deg,var(--primary),var(--accent));color:#fff;font-size:14px;cursor:pointer;white-space:nowrap}
  .af-btn.gray{background:var(--bg-sub);color:var(--text-secondary);cursor:default}
  .af-list{display:flex;flex-direction:column}
  .af-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border)}
  .af-row:last-child{border-bottom:none}
  .af-av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden}
  .af-av img{width:100%;height:100%;object-fit:cover}
  .af-info{flex:1;min-width:0}
  .af-name{font-size:14px;font-weight:700;color:var(--text)}
  .af-sub{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .af-act{flex-shrink:0}
  .af-mini{padding:6px 12px;border:none;border-radius:8px;font-size:12px;cursor:pointer;margin-left:6px}
  .af-mini.ok{background:linear-gradient(90deg,var(--primary),var(--accent));color:#fff}
  .af-mini.no{background:var(--bg-sub);color:var(--text-secondary);border:1px solid var(--border)}
  .af-empty{padding:22px;text-align:center;font-size:13px;color:var(--text-secondary)}
  .af-tip{font-size:12px;color:var(--text-secondary);margin-top:8px;line-height:1.7}
</style>

<body data-page-node-id="8J0e6zJWFfsD22FpPuOtrV">
<div class="af-wrap" data-page-node-id="4gQvbraEcDEnk6j0WzChCf">
  <div class="af-head" data-page-node-id="gbSD25B57ZTgM0YMwIZ4Xi">
    <button class="af-back" onclick="location.href='私聊.html'" title="返回" data-page-node-id="Az9XrdxnUW3JlrDVi5h1Oz">←</button>
    <div class="af-title" data-page-node-id="7s49AzquiJN8MifzFZOXQU">➕ 加好友</div>
  </div>

  <!-- 搜索找人 -->
  <div class="af-card" data-page-node-id="lisiSUfY5iAc8Oa5VUY6fG">
    <h3 data-page-node-id="OqCeYvSfHuua0E2LboNs3o">🔍 搜索找人</h3>
    <div class="af-search" data-page-node-id="guATNG8JwVKBxqKyGgRKfp">
      <input id="q" placeholder="输入用户名 / 昵称…" maxlength="30" onkeydown="if(event.key==='Enter')doSearch()" data-page-node-id="8t7galJ2GmG31iyivJEhVi">
      <button class="af-btn" onclick="doSearch()" data-page-node-id="flFpAJc0sd7XjhQWIJ2f4w">搜索</button>
    </div>
    <div class="af-tip" data-page-node-id="OVdWLPGz4C6hITcpOEEMGy">💡 输入对方的用户名（@开头那个）或昵称，发送好友申请，对方同意后即可私聊。</div>
    <div class="af-list" id="results" style="margin-top:10px" data-page-node-id="jqjHH9zqKyy7QOdpTnH7Kk"><div class="af-empty" data-page-node-id="GS437mb83HxGP8G78aDtS4">输入关键词开始搜索</div></div>
  </div>

  <!-- 收到的申请 -->
  <div class="af-card" data-page-node-id="b6BgZjQ3ur2NarxTLruDO7">
    <h3 data-page-node-id="SjD7CGt68YJ1voljJPirmg">📩 收到的申请</h3>
    <div class="af-list" id="requests" data-page-node-id="aPq7YjNWXOLIrTaQbe9SG5"><div class="af-empty" data-page-node-id="X0Xa7IJu04YEsaNk2b9G4n">加载中…</div></div>
  </div>
</div>

<script src="assets/config.js?v=20260911d"></script>
<script>
(function () {
  'use strict';
  function apiBase() { return (window.STUDY_API_BASE != null ? window.STUDY_API_BASE : ((location.protocol === 'http:' || location.protocol === 'https:') ? '' : 'http://110.42.134.62:8000')); }
  function tok() { return localStorage.getItem('study_workbench_token') || ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function avatar(u) {
    if (u && u.avatarUrl && /^(https?:|\/uploads\/|data:)/.test(u.avatarUrl)) return '<img src="' + (u.avatarUrl[0] === '/' ? apiBase() + u.avatarUrl : u.avatarUrl) + '" alt="">';
    return esc(((u && (u.nickname || '友')) || '友').slice(0, 1));
  }
  function toast(m) {
    var el = document.getElementById('afToast');
    if (!el) { el = document.createElement('div'); el.id = 'afToast'; el.style.cssText = 'position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;transition:.25s;opacity:0'; document.body.appendChild(el); }
    el.textContent = m; el.style.opacity = '1'; clearTimeout(el._t); el._t = setTimeout(function () { el.style.opacity = '0'; }, 2000);
  }
  function req(path, opts) {
    opts = opts || {};
    return fetch(apiBase() + path, {
      method: opts.method || 'GET',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok() },
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.json().then(function (d) { if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status)); return d; });
    });
  }

  window.doSearch = function () {
    var kw = (document.getElementById('q').value || '').trim();
    var box = document.getElementById('results');
    if (!kw) { renderResults([]); return; }
    box.innerHTML = '<div class="af-empty">搜索中…</div>';
    req('/api/friends/search?q=' + encodeURIComponent(kw))
      .then(function (d) { renderResults(d.items || []); })
      .catch(function (e) { box.innerHTML = '<div class="af-empty">搜索失败：' + esc(e.message) + '</div>'; });
  };

  function renderResults(items) {
    var box = document.getElementById('results');
    if (!items.length) { box.innerHTML = '<div class="af-empty">没有找到用户，试试别的关键词</div>'; return; }
    box.innerHTML = items.map(function (u, i) {
      var act;
      if (u.isFriend) act = '<button class="af-btn" onclick="afOpenChat(' + u.id + ')">💬 发消息</button>' +
        '<button class="af-mini no" onclick="afRemoveFriend(' + u.id + ')">删除好友</button>';
      else if (u.blockedMe) act = '<button class="af-btn gray">不可添加</button>';
      else act = '<button class="af-btn" onclick="addFriend(' + u.id + ',' + i + ')" id="addBtn' + i + '">➕ 加好友</button>';
      return '<div class="af-row"><div class="af-av">' + avatar(u) + '</div>' +
        '<div class="af-info"><div class="af-name">' + esc(u.nickname) + '</div><div class="af-sub">@' + esc(u.username) + (u.motto ? ' · ' + esc(u.motto) : '') + '</div></div>' +
        '<div class="af-act">' + act + '</div></div>';
    }).join('');
  }

  window.addFriend = function (uid, i) {
    req('/api/friends/requests', { method: 'POST', body: { toUserId: uid } })
      .then(function (r) {
        toast(r.autoAccepted ? '✅ 你们已经是好友啦，去私聊吧' : '✅ 好友申请已发送，等待对方同意');
        var b = document.getElementById('addBtn' + i);
        if (b) { b.className = 'af-btn gray'; b.textContent = r.autoAccepted ? '已是好友' : '已发送'; b.onclick = null; }
      })
      .catch(function (e) { toast('⚠️ ' + e.message); });
  };

  function loadRequests() {
    var box = document.getElementById('requests');
    if (!tok()) { box.innerHTML = '<div class="af-empty">🔒 请先<a href="登录.html" style="color:var(--primary)">登录</a>后使用加好友功能</div>'; return; }
    req('/api/friends/requests')
      .then(function (d) {
        var inc = d.incoming || [];
        if (!inc.length) { box.innerHTML = '<div class="af-empty">暂无收到的好友申请</div>'; return; }
        box.innerHTML = inc.map(function (r) {
          return '<div class="af-row"><div class="af-av">' + avatar(r.user) + '</div>' +
            '<div class="af-info"><div class="af-name">' + esc(r.user.nickname) + '</div><div class="af-sub">@' + esc(r.user.username) + '</div></div>' +
            '<div class="af-act"><button class="af-mini ok" onclick="actRequest(' + r.id + ',1,this)">同意</button>' +
            '<button class="af-mini no" onclick="actRequest(' + r.id + ',0,this)">拒绝</button></div></div>';
        }).join('');
      })
      .catch(function (e) { box.innerHTML = '<div class="af-empty">' + esc(e.message) + '</div>'; });
  }
  window.actRequest = function (rid, accept, btn) {
    req('/api/friends/requests/' + rid + '/' + (accept ? 'accept' : 'decline'), { method: 'POST' })
      .then(function () { toast(accept ? '✅ 已同意，现在可以私聊了' : '已拒绝'); loadRequests(); })
      .catch(function (e) { toast('⚠️ ' + e.message); });
  };

  /* ==================== A4/A5（2026-09-11）：已是好友 → 「发消息」+「删除好友」 ==================== */
  window.afOpenChat = function (uid) {
    location.href = '私聊.html?uid=' + uid;
  };
  window.afRemoveFriend = function (uid) {
    if (!confirm('确定删除该好友吗？\n删除后双方互不可见，且无法继续私聊。')) return;
    req('/api/friends/' + uid, { method: 'DELETE' })
      .then(function () { toast('🗑 已删除好友，可重新添加'); doSearch(); })
      .catch(function (e) { toast('⚠️ ' + e.message); });
  };

  loadRequests();
})();
</script>
</body>
</html>
