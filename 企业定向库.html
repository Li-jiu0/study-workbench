<style>
/* ===== 企业定向库页专属样式（T10 / A6，类名统一 cl- 前缀） ===== */
[hidden] { display: none !important; }
body { background: var(--xt-bg); }
.cl-shell { max-width: 980px; margin: 0 auto; padding: var(--xt-space-4) var(--xt-space-4) var(--xt-space-8); }
.cl-shell .card { background: var(--xt-bg-card); border: 1px solid var(--xt-border); border-radius: var(--xt-radius-lg); padding: var(--xt-space-4); margin-bottom: var(--xt-space-4); box-shadow: var(--xt-shadow-sm); }

/* hero */
.cl-hero { display: flex; align-items: flex-start; gap: var(--xt-space-3); flex-wrap: wrap; }
.cl-hero-icon { width: 46px; height: 46px; border-radius: var(--xt-radius-md); background: var(--xt-primary-soft); color: var(--xt-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cl-hero-main { flex: 1; min-width: 220px; }
.cl-hero-title { font-size: var(--xt-font-xl); font-weight: 600; color: var(--xt-text); line-height: 1.3; }
.cl-hero-sub { font-size: var(--xt-font-sm); color: var(--xt-text-dim); margin-top: 4px; }
.cl-credit { margin-top: var(--xt-space-3); font-size: var(--xt-font-xs); color: var(--xt-text-hint); line-height: 1.6; }

/* 进度条 */
.cl-prog-head { display: flex; align-items: center; justify-content: space-between; gap: var(--xt-space-3); flex-wrap: wrap; }
.cl-prog-label { font-size: var(--xt-font-md); font-weight: 600; color: var(--xt-text); display: flex; align-items: center; gap: 6px; }
.cl-prog-num { font-size: var(--xt-font-sm); color: var(--xt-text-dim); }
.cl-prog-num b { color: var(--xt-primary); font-size: var(--xt-font-md); }
.cl-prog-bar { margin-top: var(--xt-space-3); height: 10px; border-radius: 999px; background: var(--xt-bg-muted); overflow: hidden; }
.cl-prog-bar i { display: block; height: 100%; background: var(--xt-primary); border-radius: 999px; transition: width var(--xt-transition-slow); }
.cl-prog-hint { margin-top: var(--xt-space-2); font-size: var(--xt-font-xs); color: var(--xt-text-hint); }

#clSearch { margin-top: var(--xt-space-3); }
.cl-cat-sel { margin-top: var(--xt-space-2); cursor: pointer; }

/* 列表 */
.cl-grid { display: grid; grid-template-columns: 1fr; gap: var(--xt-space-3); margin-top: var(--xt-space-3); }
@media (min-width: 760px) { .cl-grid { grid-template-columns: 1fr 1fr; } }
.cl-card { border: 1px solid var(--xt-border); border-radius: var(--xt-radius-md); padding: var(--xt-space-3); background: var(--xt-bg-card); transition: all var(--xt-transition); }
.cl-card:hover { border-color: var(--xt-primary); box-shadow: var(--xt-shadow-md); }
.cl-card.is-learned { border-left: 3px solid var(--xt-success); }
.cl-card-top { display: flex; gap: var(--xt-space-3); align-items: flex-start; cursor: pointer; }
.cl-card-icon { width: 38px; height: 38px; border-radius: var(--xt-radius-sm); background: var(--xt-bg-muted); color: var(--xt-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cl-card-head { min-width: 0; }
.cl-card-name { font-size: var(--xt-font-md); font-weight: 600; color: var(--xt-text); line-height: 1.4; }
.cl-card-tagline { font-size: var(--xt-font-xs); color: var(--xt-text-dim); margin-top: 2px; }
.cl-card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--xt-space-3); }
.cl-chip { font-size: var(--xt-font-xs); color: var(--xt-text-dim); background: var(--xt-bg-muted); border-radius: var(--xt-radius-sm); padding: 2px 8px; display: inline-flex; align-items: center; gap: 4px; }
.cl-chip.is-ok { color: var(--xt-primary); background: var(--xt-primary-soft); }
.cl-chip.is-learned { color: var(--xt-success); }
.cl-chip.is-fav { color: var(--xt-warning); }
.cl-card-ops { display: flex; flex-wrap: wrap; gap: 8px; margin-top: var(--xt-space-3); }

/* 按钮 */
.cl-btn { border: 1px solid var(--xt-border); background: var(--xt-bg-card); color: var(--xt-text-dim); border-radius: var(--xt-radius-sm); padding: 6px 12px; font-size: var(--xt-font-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all var(--xt-transition); }
.cl-btn:hover { border-color: var(--xt-primary); color: var(--xt-primary); }
.cl-btn.is-on { color: var(--xt-success); border-color: var(--xt-success); }
.cl-btn-primary { background: var(--xt-primary); border-color: var(--xt-primary); color: var(--xt-text-on-primary); }
.cl-btn-primary:hover { background: var(--xt-primary); color: var(--xt-text-on-primary); opacity: .9; }
.cl-btn-ghost { background: var(--xt-primary-soft); border-color: transparent; color: var(--xt-primary); }

/* 详情 */
.cl-head { display: flex; gap: var(--xt-space-3); align-items: flex-start; flex-wrap: wrap; border-bottom: 1px solid var(--xt-divider); padding-bottom: var(--xt-space-3); }
.cl-head-icon { width: 42px; height: 42px; border-radius: var(--xt-radius-md); background: var(--xt-primary-soft); color: var(--xt-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cl-head-main { flex: 1; min-width: 200px; }
.cl-head-name { font-size: var(--xt-font-lg); font-weight: 600; color: var(--xt-text); line-height: 1.35; }
.cl-head-sub { font-size: var(--xt-font-sm); color: var(--xt-text-dim); margin-top: 3px; }
.cl-head-ops { display: flex; flex-wrap: wrap; gap: 8px; }

.cl-sec { padding: var(--xt-space-3) 0; border-bottom: 1px dashed var(--xt-divider); }
.cl-sec:last-of-type { border-bottom: none; }
.cl-sec-h { font-size: var(--xt-font-md); font-weight: 600; color: var(--xt-text); margin: 0 0 var(--xt-space-3); display: flex; align-items: center; gap: 6px; }
.cl-row { display: flex; gap: var(--xt-space-3); margin-bottom: var(--xt-space-2); font-size: var(--xt-font-sm); line-height: 1.75; }
.cl-k { flex: 0 0 88px; color: var(--xt-text-dim); font-weight: 500; }
.cl-v { flex: 1; min-width: 0; color: var(--xt-text); }
.cl-ul { margin: 0; padding-left: 18px; }
.cl-ul li { margin-bottom: 3px; }
.cl-note { margin-top: 6px; font-size: var(--xt-font-xs); color: var(--xt-text-hint); }
.cl-table { width: 100%; border-collapse: collapse; font-size: var(--xt-font-xs); margin-bottom: 4px; }
.cl-table th, .cl-table td { border: 1px solid var(--xt-border); padding: 6px 8px; text-align: left; vertical-align: top; }
.cl-table th { background: var(--xt-bg-muted); color: var(--xt-text-dim); font-weight: 600; white-space: nowrap; }
.cl-table td.cl-ratio { white-space: nowrap; color: var(--xt-primary); }
.cl-block { margin-bottom: var(--xt-space-3); }
.cl-block-h { font-size: var(--xt-font-sm); font-weight: 600; color: var(--xt-text); margin-bottom: 4px; }
.cl-block-b { font-size: var(--xt-font-sm); color: var(--xt-text); line-height: 1.8; }
.cl-links { display: flex; flex-wrap: wrap; gap: 8px; padding-top: var(--xt-space-3); }

/* 自测 */
.cl-q { margin-bottom: var(--xt-space-4); }
.cl-q-stem { font-size: var(--xt-font-sm); font-weight: 600; color: var(--xt-text); line-height: 1.7; margin-bottom: 8px; }
.cl-q-opts { display: grid; grid-template-columns: 1fr; gap: 6px; }
.cl-opt { display: flex; align-items: flex-start; gap: 8px; text-align: left; border: 1px solid var(--xt-border); background: var(--xt-bg-card); border-radius: var(--xt-radius-sm); padding: 8px 10px; font-size: var(--xt-font-sm); color: var(--xt-text); cursor: pointer; transition: all var(--xt-transition); }
.cl-opt:hover { border-color: var(--xt-primary); }
.cl-opt-l { flex: 0 0 18px; font-weight: 700; color: var(--xt-text-dim); }
.cl-opt-t { flex: 1; line-height: 1.6; }
.cl-opt.is-right { border-color: var(--xt-success); background: var(--xt-success); color: #fff; }
.cl-opt.is-right .cl-opt-l { color: #fff; }
.cl-opt.is-wrong { border-color: var(--xt-error); background: var(--xt-error); color: #fff; }
.cl-opt.is-wrong .cl-opt-l { color: #fff; }
.cl-opt.is-locked { cursor: default; opacity: .95; }
.cl-x { margin-top: 8px; font-size: var(--xt-font-xs); line-height: 1.75; padding: 8px 10px; border-radius: var(--xt-radius-sm); background: var(--xt-bg-muted); color: var(--xt-text-dim); }
.cl-x.is-ok { border-left: 3px solid var(--xt-success); }
.cl-x.is-no { border-left: 3px solid var(--xt-error); }
.cl-q-result { font-size: var(--xt-font-sm); color: var(--xt-text-dim); padding: 10px 0 2px; }
.cl-q-result b { color: var(--xt-primary); }
.cl-empty { text-align: center; color: var(--xt-text-hint); padding: var(--xt-space-6) 0; font-size: var(--xt-font-sm); }
/* ===== R73 需求20-B 移动端适配（≤768px）=====
   仅作用于窄屏；桌面端(>768px)渲染零影响（本块整体位于媒体查询内）。
   1) 内嵌媒体兜底 max-width，防 JS 注入内容/未来素材撑破窄屏；
   2) 宽表格窄屏内横向滚动，避免整页横向溢出（需求20-B #2）；
   3) 字号下限兜底：common.css 的 .bn-label(10px)/.ai-mode-badge(9px)/
      .study-stats-bar b(9px) 低于 A7 辅助≥11px，页内窄屏提升到 11px（不改共享 common.css）。 */
@media (max-width: 768px) {
  img, video, canvas, iframe { max-width: 100%; height: auto; }
  table { display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .bottom-nav-item .bn-label, .ai-mode-badge, .study-stats-bar b { font-size: 11px; }
  /* 详情表格：实测 320px 下 .cl-table right=341>320 真实横向溢出，
     窄屏改块级 + 横向滚动容器；表头解除 nowrap 允许换行（#1/#2/#4） */
  .cl-table { display: block; width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cl-table th { white-space: normal; }
}
</style>
